<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bolsa Panadera Patagonia</title>
<style>
body{background:#FFF7CC;font-family:system-ui,Roboto;margin:0;padding:12px}
.header{text-align:center;padding:14px;font-weight:900;font-size:22px;color:#6B3F00}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;margin:8px 0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brown{background:#6B3F00;color:#fff}.yellow{background:#FFD23F;color:#1a1a1a}.black{background:#1a1a1a;color:#FFD23F}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.badge{display:inline-block;background:#eee;border-radius:12px;padding:4px 8px;font-size:11px;margin:2px}
.phone{font-weight:900;color:#0a7e07;font-size:18px;margin-top:6px}
.exp{background:#fafafa;border-left:4px solid #FFD23F;border-radius:8px;padding:10px;margin-top:10px;line-height:1.5}
.exp .tit{font-weight:800;font-size:12px;text-transform:uppercase;margin-bottom:6px}
.hidden{display:none}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0;box-sizing:border-box}
label{font-weight:700;font-size:13px;margin-top:8px;display:block}
hr{border:0;border-top:1px solid #eee;margin:10px 0}
</style>
</head>
<body>
<div class="header">🥖 BOLSA PANADERA PATAGONIA</div>

<div id="home">
<button class="btn brown" onclick="show('emp')">🥖 Busco Trabajo (Empleado)</button>
<button class="btn yellow" onclick="show('com')">🏪 Soy Comercio / Busco Empleado</button>
<button class="btn black" onclick="verBolsa()">👀 Ver Bolsa de Empleados</button>
</div>

<div id="formEmp" class="hidden"><div class="card">
<h3>Registro Empleado</h3>
<label>Nombre completo</label><input id="e_nombre">
<label>WhatsApp</label><input id="e_tel" placeholder="2974...">
<label>Provincia</label><select id="e_prov"><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<label>Ciudad</label><input id="e_ciu" value="Comodoro Rivadavia">
<label>Oficio</label><select id="e_ofi"><option>Cajero</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Maestranza</option><option>Atención al público</option><option>Ayudante</option><option>Repartidor</option><option>Sanwichera</option><option>Otro</option></select>
<hr>
<label>Nombre panadería último empleo</label><input id="e_pan_nom">
<label>Dirección panadería</label><input id="e_pan_dir">
<label>Contacto / Tel panadería</label><input id="e_pan_cont">
<button class="btn black" onclick="guardarEmpleado()">Enviar solicitud</button>
<button class="btn" style="background:#eee" onclick="goHome()">Volver</button>
</div></div>

<div id="formCom" class="hidden"><div class="card">
<h3>Registro Comercio</h3>
<label>Nombre comercio</label><input id="c_nombre">
<label>Teléfono</label><input id="c_tel">
<label>Localidad</label><input id="c_loc">
<button class="btn yellow" onclick="guardarComercio()">Solicitar acceso</button>
<button class="btn" style="background:#eee" onclick="goHome()">Volver</button>
</div></div>

<div id="bolsa" class="hidden">
<div class="card"><h3>Bolsa de Trabajadores</h3><div id="status">Cargando...</div><div id="lista"></div></div>
<button class="btn" style="background:#eee" onclick="goHome()">Volver</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcf6ovrDXhAWmUw8uPdMEwTVjnOSvTMKrcmk01B32rfjScyd3-QfTa-Kat54pTpFIM/exec";

function goHome(){
 document.getElementById('formEmp').classList.add('hidden');
 document.getElementById('formCom').classList.add('hidden');
 document.getElementById('bolsa').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
}
function show(t){
 goHome();
 document.getElementById('home').classList.add('hidden');
 if(t==='emp') document.getElementById('formEmp').classList.remove('hidden');
 if(t==='com') document.getElementById('formCom').classList.remove('hidden');
}

async function verBolsa(){
 document.getElementById('home').classList.add('hidden');
 document.getElementById('bolsa').classList.remove('hidden');
 document.getElementById('status').innerText="Cargando...";
 document.getElementById('lista').innerHTML="";
 try{
   const r=await fetch(SCRIPT_URL+"?action=getEmpleados");
   const data=await r.json();
   document.getElementById('status').innerText="Se encontraron "+data.length+" trabajadores";
   render(data);
 }catch(e){
   document.getElementById('status').innerText="Error cargando. Revisá la implementación.";
 }
}

function render(data){
 const cont=document.getElementById('lista');
 cont.innerHTML=data.map(row=>{
   let nombre=row[0], wsp=row[1], prov=row[2], ciudad=row[3], oficio=row[4], panNom=row[5], panDir=row[6], panCont=row[7];
   if(!Array.isArray(row)){
     nombre=row.nombre||row[0]; wsp=row.wsp||row[1]; prov=row.provincia||row[2]; ciudad=row.ciudad||row[3]; oficio=row.oficio||row[4];
     panNom=row.panaderia_nombre||row[5]; panDir=row.panaderia_direc||row[6]; panCont=row.panaderia_cont||row[7];
   }
   const noCarga=(v)=>!v||String(v).toLowerCase().includes('no carg')||String(v).trim()==='';
   
   let htmlExp="";
   if(!noCarga(panNom)||!noCarga(panDir)||!noCarga(panCont)){
     htmlExp=`<div class="exp">
       <div class="tit">📋 ÚLTIMO EMPLEO</div>
       ${!noCarga(panNom)?`🏪 <b>Panadería:</b> ${panNom}<br>`:''}
       ${!noCarga(panDir)?`📍 <b>Dirección:</b> ${panDir}<br>`:''}
       ${!noCarga(panCont)?`📞 <b>Tel:</b> ${panCont}`:''}
     </div>`;
   }else{
     htmlExp=`<div class="exp" style="border-left-color:#ddd"><div class="tit">📋 Último empleo</div><span style="color:#888;font-size:13px">No cargó datos de empleo anterior</span></div>`;
   }

   return `<div class="card">
     <div style="display:flex;justify-content:space-between"><strong>${nombre||''}</strong><span class="badge">${oficio||''}</span></div>
     <div style="font-size:13px;margin-top:4px">📍 ${ciudad||''} - ${prov||''}</div>
     <div class="phone">📱 ${wsp||''}</div>
     <hr>
     ${htmlExp}
     <a href="https://wa.me/${String(wsp||'').replace(/\D/g,'')}" target="_blank" class="btn black" style="text-align:center;text-decoration:none;display:block;margin-top:10px">WhatsApp</a>
   </div>`;
 }).join('');
}

async function guardarEmpleado(){
 const d={action:"addEmpleado",nombre:document.getElementById('e_nombre').value,telefono:document.getElementById('e_tel').value,provincia:document.getElementById('e_prov').value,ciudad:document.getElementById('e_ciu').value,oficio:document.getElementById('e_ofi').value,panaderia_nombre:document.getElementById('e_pan_nom').value,panaderia_direc:document.getElementById('e_pan_dir').value,panaderia_cont:document.getElementById('e_pan_cont').value};
 if(!d.nombre||!d.telefono){alert("Completa nombre y wsp");return;}
 await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(d)});
 alert("¡Registrado! Ya apareces en la bolsa.");goHome();
}
async function guardarComercio(){
 const d={action:"addComercio",nombre:document.getElementById('c_nombre').value,telefono:document.getElementById('c_tel').value,localidad:document.getElementById('c_loc').value};
 await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(d)});
 alert("Solicitud enviada");goHome();
}
</script>
</body>
</html>
