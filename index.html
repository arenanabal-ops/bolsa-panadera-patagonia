<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa Panaderos Patagonia</title>
<style>
body{background:#fef9e7;margin:0;padding:15px;font-family:Arial,sans-serif}
.card{background:white;max-width:600px;margin:30px auto;padding:28px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h2{margin:0 0 8px 0} p{color:#555}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;font-size:16px;box-sizing:border-box;margin:8px 0}
button{width:100%;padding:14px;background:#ff6f00;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:6px}
button.gris{background:#e0e0e0;color:#333}
.oculto{display:none}
.item{border:1px solid #f0e6c8;padding:14px;border-radius:10px;margin:10px 0;background:#fffdf5;text-align:left}
.ultima{background:#fff8e1;padding:10px;border-radius:8px;margin-top:8px;border-left:4px solid #ff6f00;font-size:14px}
.wa{display:inline-block;background:#25D366;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold;margin-left:6px}
.filtros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:500px){.filtros{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<div id="login">
<h2>🥖 Bolsa Panaderos Patagonia</h2>
<p>Si sos panadería autorizada, ingresá tu WhatsApp</p>
<input id="telInput" type="number" placeholder="Ej: 2974007317">
<button onclick="verificar()">Ya estoy autorizado, ver bolsa</button>
<p id="msg" style="color:red;text-align:center"></p>
</div>

<div id="bolsa" class="oculto">
<h2>✅ Hola <span id="nombreAut"></span><br><small style="font-weight:normal" id="comercioAut"></small></h2>

<div class="filtros">
<select id="filtroOficio" onchange="filtrar()"><option value="">Todos los oficios</option></select>
<select id="filtroProv" onchange="filtrar()"><option value="">Todas las provincias</option></select>
<select id="filtroCiudad" onchange="filtrar()"><option value="">Todas las ciudades</option></select>
</div>

<div id="contador" style="text-align:center;font-weight:bold;margin:12px 0"></div>
<div id="lista"></div>

<button class="gris" onclick="location.reload()">Salir</button>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGj5IeGWMkOrSoUe-tXdVvcwusHdGGNDVvzzE2lW6EuSy4qJp8ov7Zt1mBXayuzOAk/exec";
let TRAB = [];
function normTel(t){return String(t||"").replace(/\D/g,"").slice(-10);}

async function verificar(){
 let tel=normTel(document.getElementById("telInput").value);
 if(tel.length<10){document.getElementById("msg").innerText="Número inválido";return;}
 document.getElementById("msg").innerText="Verificando...";
 let r=await fetch(`${SCRIPT_URL}?accion=verificar&telefono=${tel}&v=${Date.now()}`);
 let d=await r.json();
 if(d.autorizado){
  document.getElementById("login").classList.add("oculto");
  document.getElementById("bolsa").classList.remove("oculto");
  document.getElementById("nombreAut").innerText=d.nombre;
  document.getElementById("comercioAut").innerText=d.comercio||"";
  cargarTrabajadores();
 }else{document.getElementById("msg").innerText="❌ No autorizado";}
}

async function cargarTrabajadores(){
 document.getElementById("lista").innerHTML="Cargando trabajadores...";
 let r=await fetch(`${SCRIPT_URL}?accion=lista_trabajadores&v=${Date.now()}`);
 let data=await r.json();
 TRAB=data;

 // Cargar opciones de filtros con datos reales de la planilla
 let oficios=new Set(), provs=new Set(), ciudades=new Set();
 for(let i=1;i<data.length;i++){
   if(!data[i][0])continue;
   if(data[i][4]) oficios.add(data[i][4]);
   if(data[i][2]) provs.add(data[i][2]);
   if(data[i][3]) ciudades.add(data[i][3]);
 }
 let selOf=document.getElementById("filtroOficio");
 oficios.forEach(o=>{let op=document.createElement("option");op.value=o;op.text=o;selOf.appendChild(op);});
 let selP=document.getElementById("filtroProv");
 provs.forEach(o=>{let op=document.createElement("option");op.value=o;op.text=o;selP.appendChild(op);});
 let selC=document.getElementById("filtroCiudad");
 ciudades.forEach(o=>{let op=document.createElement("option");op.value=o;op.text=o;selC.appendChild(op);});

 render(data);
}

function render(data){
 let h=""; let c=0;
 for(let i=1;i<data.length;i++){let f=data[i];if(!f[0])continue;c++;
  let wspClean=String(f[1]||"").replace(/\D/g,"");
  h+=`<div class="item" data-oficio="${(f[4]||"").toLowerCase()}" data-prov="${(f[2]||"").toLowerCase()}" data-ciudad="${(f[3]||"").toLowerCase()}">
  <b>${f[0]}</b> - ${f[4]||""}<br>
  <span>📍 ${f[2]||""} - ${f[3]||""}</span><br>
  📱 ${f[1]||""}<a class="wa" target="_blank" href="https://wa.me/${wspClean}">WhatsApp</a>
  <div class="ultima"><b>Última panadería:</b> ${f[5]||"No informó"}<br>${f[6]?`📍 ${f[6]}<br>`:""}${f[7]?`📞 ${f[7]}`:""}</div>
  </div>`;}
 document.getElementById("contador").innerText=`Total: ${c} trabajadores`;
 document.getElementById("lista").innerHTML=h;
}

function filtrar(){
 let of=document.getElementById("filtroOficio").value.toLowerCase();
 let pr=document.getElementById("filtroProv").value.toLowerCase();
 let ci=document.getElementById("filtroCiudad").value.toLowerCase();
 let vis=0;
 document.querySelectorAll(".item").forEach(el=>{
  let okOf=!of || el.dataset.oficio.includes(of);
  let okPr=!pr || el.dataset.prov.includes(pr);
  let okCi=!ci || el.dataset.ciudad.includes(ci);
  let show=okOf&&okPr&&okCi;
  el.style.display=show?"block":"none";
  if(show)vis++;
 });
 document.getElementById("contador").innerText=`Mostrando: ${vis}`;
}
</script>
</body>
</html>
