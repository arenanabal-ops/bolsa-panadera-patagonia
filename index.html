<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa de Panaderos - Patagonia</title>
<style>
body{background:#FFF7ED;font-family:system-ui;margin:0;padding:10px}
.header{text-align:center;padding:20px 0;color:#7C2D12;font-weight:900;font-size:22px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.btns button{border:0;padding:16px 20px;border-radius:12px;font-weight:900;color:#fff;cursor:pointer}
.b1{background:#EA580C}.b2{background:#CA8A04}.b3{background:#15803D}.b4{background:#1E293B}
.card{background:#fff;border-radius:12px;padding:16px;max-width:800px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.06)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:16px}
.hidden{display:none}.item{border-bottom:1px solid #eee;padding:12px 0}.badge{background:#0A1931;color:#FFC947;padding:3px 8px;border-radius:8px;font-size:11px}
button.verde{background:#27ae60;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:900;width:100%;margin-top:10px}
button.wsp{background:#25D366;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:800}
.ultima{background:#fff8e1;padding:10px;border-radius:8px;margin-top:8px;border-left:4px solid #ff6f00;font-size:14px}
.ok{color:#15803D;font-weight:800}.error{color:#DC2626;font-weight:800}
</style>
</head>
<body>
<div class="header">🥖 Bolsa de Panaderos - Patagonia</div>
<div class="btns">
<button class="b1" onclick="show('trabajador')">👷 Soy Trabajador</button>
<button class="b2" onclick="show('panaderia')">🏪 Tengo Comercio</button>
<button class="b3" onclick="show('bolsa')">📋 Ver Bolsa</button>
<button class="b4" onclick="show('admin')">🔐 Admin</button>
</div>

<div id="trabajador" class="card hidden"><h3>Soy Trabajador</h3><input id="t_nombre" placeholder="Nombre y Apellido *"><input id="t_wsp" placeholder="WhatsApp"><select id="t_prov" onchange="cargarCiudades('t_prov','t_ciu')"><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select><select id="t_ciu"><option>Comodoro Rivadavia</option><option>Trelew</option></select><input id="t_exp1_nom" placeholder="Nombre comercio donde trabajaste *"><input id="t_exp1_dir" placeholder="Dirección comercio *"><input id="t_exp1_tel" placeholder="Tel referencia *"><button class="verde" onclick="guardarT()">Guardar</button><div id="t_msg"></div></div>
<div id="panaderia" class="card hidden"><h3>Tengo Comercio</h3><input id="p_nombre" placeholder="Nombre comercio"><input id="p_tel" placeholder="WhatsApp"><button class="verde" onclick="guardarP()">Solicitar</button><div id="p_msg"></div></div>

<div id="bolsa" class="card">
<div style="text-align:center"><b>🥖 Bolsa Panaderos Patagonia</b><br><small>Si sos panadería autorizada, ingresá tu WhatsApp</small><br><br><input id="login_wsp" placeholder="Ej: 2974007317"><button class="verde" style="background:#ff6f00" onclick="loginBolsa()">Ya estoy autorizado, ver bolsa</button><div id="login_msg"></div></div>
<div id="bolsa_panel" class="hidden">
<div id="saludo_comercio" style="background:#DCFCE7;color:#166534;padding:12px;border-radius:8px;font-weight:900;text-align:center;margin:10px 0"></div>
<select id="f_of" onchange="filtrar()"><option value="">-- Oficio --</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Maestro Panadero</option><option>Ayudante</option><option>Cajero</option></select>
<select id="f_prov" onchange="filtrar()"><option value="">-- Provincia --</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<select id="f_ciu" onchange="filtrar()"><option value="">-- Ciudad --</option></select>
<button class="verde" onclick="cargarDesdeSheet()">🔄 Cargar / Recargar</button>
<div id="contador" style="text-align:center;font-weight:800;margin:10px"></div>
<div id="lista"></div>
</div>
</div>

<div id="admin" class="card hidden"><h3>Admin</h3><input id="a_pass" type="password" placeholder="Clave admin"><button class="verde" onclick="loginAdmin()">Entrar</button><div id="a_msg"></div><div id="a_panel" class="hidden"><div id="stats"></div><div id="a_lista"></div></div></div>

<script>
const URL_SHEET="https://script.google.com/macros/s/AKfycbwcf6ovrDXhAWmUw8uPdMEwTVjnOSvTMKrcmk01B32rfjScyd3-QfTa-Kat54pTpFIM/exec";
const CLAVE_ADMIN="chanchadas";
const CIUDADES={"Chubut":["Comodoro Rivadavia","Trelew","Puerto Madryn","Rawson","Esquel","Sarmiento","Rada Tilly"],"Santa Cruz":["Rio Gallegos","Caleta Olivia","Pico Truncado"],"Rio Negro":["Bariloche","Cipolletti","Roca","Viedma"],"Neuquen":["Neuquen","Centenario"],"Tierra del Fuego":["Ushuaia","Rio Grande"]};
let DATA=[]; let MI_WSP="";
function show(id){document.querySelectorAll('#trabajador,#panaderia,#bolsa,#admin').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function cargarCiudades(idP,idC){let p=document.getElementById(idP).value;let sel=document.getElementById(idC);let l=CIUDADES[p]||[];sel.innerHTML=l.map(c=>`<option>${c}</option>`).join('');}
function loginBolsa(){
 let num=document.getElementById('login_wsp').value.trim();
 document.getElementById('login_msg').innerText='Verificando...';
 fetch(URL_SHEET+"?accion=verificar&num="+encodeURIComponent(num)).then(r=>r.json()).then(j=>{
  if(j.autorizado){
   MI_WSP=num;
   document.getElementById('saludo_comercio').innerText='👋 Hola '+j.nombre+' '+(j.comercio||'')+', bienvenido!';
   document.getElementById('login_msg').innerHTML='<span class=ok>✅ Autorizado</span>';
   document.getElementById('bolsa_panel').classList.remove('hidden');
   cargarDesdeSheet();
  }else{document.getElementById('login_msg').innerHTML='<span class=error>❌ No autorizado</span>';}
 });
}
function cargarDesdeSheet(){
 document.getElementById('lista').innerHTML='Cargando...';
 fetch(URL_SHEET+"?accion=listar&v="+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j.trabajadores||[];
  document.getElementById('contador').innerText='Total: '+DATA.length+' trabajadores';
  if(DATA.length==0){document.getElementById('lista').innerHTML='No hay trabajadores cargados en la hoja Trabajadores';return;}
  render(DATA);
 }).catch(e=>{document.getElementById('lista').innerHTML='Error: '+e;});
}
function render(l){
 document.getElementById('lista').innerHTML=l.map(t=>`
  <div class=item>
   <b>${t.nombre}</b> <span class=badge>${t.puesto}</span><br>
   📍 ${t.ciudad} - ${t.provincia}<br>
   📱 ${t.wsp}<br>
   <div class=ultima>
    <b>🏪 Último trabajo:</b><br>
    Nombre: <b>${t.panaderia_nomb||'No informó'}</b><br>
    ${t.panaderia_direc?`Dirección: ${t.panaderia_direc}<br>`:''}
    ${t.panaderia_cont?`Tel referencia: ${t.panaderia_cont}`:''}
   </div>
   <button class="wsp" onclick="window.open('https://wa.me/549${String(t.wsp).replace(/\\D/g,'')}','_blank')">📲 CONTACTAR</button>
  </div>`).join('');
}
function filtrar(){
 let of=(document.getElementById('f_of').value||"").toLowerCase();
 let pr=(document.getElementById('f_prov').value||"").toLowerCase();
 let ci=(document.getElementById('f_ciu').value||"").toLowerCase();
 let base=DATA.filter(t=>{
  let okOf=!of||(t.puesto||"").toLowerCase().includes(of);
  let okPr=!pr||(t.provincia||"").toLowerCase().includes(pr);
  let okCi=!ci||(t.ciudad||"").toLowerCase().includes(ci);
  return okOf&&okPr&&okCi;
 });
 document.getElementById('contador').innerText='Mostrando: '+base.length+' de '+DATA.length;
 render(base);
}
function guardarT(){let d={tipo:"trabajador",nombre:document.getElementById('t_nombre').value,wsp:document.getElementById('t_wsp').value,provincia:document.getElementById('t_prov').value,ciudad:document.getElementById('t_ciu').value,oficio:"Panadero",panaderia_nomb:document.getElementById('t_exp1_nom').value,panaderia_direc:document.getElementById('t_exp1_dir').value,panaderia_cont:document.getElementById('t_exp1_tel').value};fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('t_msg').innerText='Guardado';});}
function guardarP(){let d={tipo:"panaderia",nombreP:document.getElementById('p_nombre').value,tel:document.getElementById('p_tel').value};fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('p_msg').innerText='Enviado';});}
function loginAdmin(){
 if(document.getElementById('a_pass').value===CLAVE_ADMIN){
  document.getElementById('a_panel').classList.remove('hidden');
  document.getElementById('a_msg').innerHTML='<span class=ok>✅ Admin ok</span>';
  fetch(URL_SHEET+"?accion=listar_admin").then(r=>r.json()).then(j=>{
   document.getElementById('stats').innerText='Trabajadores:'+j.trabajadores.length+' | Comercios:'+j.panaderias.length+' | Aut:'+j.autorizados.length;
   document.getElementById('a_lista').innerHTML=j.trabajadores.map(t=>`<div class=item>${t.nombre} - ${t.wsp}</div>`).join('')+j.panaderias.map(p=>`<div class=item>🏪 ${p.nombre} - ${p.estado}</div>`).join('');
  });
 }else{document.getElementById('a_msg').innerHTML='<span class=error>❌ Clave incorrecta, es: chanchadas</span>';}
}
show('bolsa');
</script>
</body>
</html>
