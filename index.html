<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa de Panaderos - Patagonia</title>
<style>
body{background:#FFF7ED;font-family:system-ui;margin:0;padding:10px}
.header{text-align:center;padding:20px 0;color:#7C2D12;font-weight:900;font-size:24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.btns button{border:0;padding:18px 24px;border-radius:14px;font-weight:900;color:#fff;cursor:pointer;font-size:18px;min-width:170px}
.b1{background:#EA580C}.b2{background:#CA8A04}.b3{background:#15803D}.b4{background:#1E293B}
.card{background:#fff;border-radius:12px;padding:18px;max-width:800px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #E7E5E4;margin:7px 0;font-size:16px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.checks label{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;background:#FFF7ED;padding:6px;border-radius:8px}
label{font-weight:800;font-size:13px;margin-top:12px;display:block}
.hidden{display:none}.item{border-bottom:1px solid #eee;padding:12px 0}.badge{background:#0A1931;color:#FFC947;padding:3px 8px;border-radius:8px;font-size:11px}
button.verde{background:#27ae60;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:900;width:100%;margin-top:12px}
button.wsp{background:#25D366;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:800}
.error{color:#DC2626;font-weight:800}.ok{color:#15803D;font-weight:800}
.ultima{background:#fff8e1;padding:10px;border-radius:8px;margin-top:8px;border-left:4px solid #ff6f00;font-size:14px}
</style>
</head>
<body>
<div class="header">🥖 Bolsa de Panaderos - Patagonia</div>
<div class="btns">
<button class="b1" onclick="show('trabajador')">👷 Soy Trabajador</button>
<button class="b2" onclick="show('panaderia')">🏪 Tengo Comercio</button>
<button class="b3" onclick="show('bolsa')">📋 Ver Bolsa</button>
<button class="b4" onclick="show('admin')">🔐 Admin</button>
</div>

<div id="trabajador" class="card">
<h3>Soy Trabajador - * Obligatorio</h3>
<input id="t_nombre" placeholder="Nombre y Apellido *">
<input id="t_wsp" placeholder="WhatsApp * ej 2974123456" type="tel">
<select id="t_prov" onchange="cargarCiudades('t_prov','t_ciu')"><option value="">-- Provincia * --</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<select id="t_ciu" onchange="checkOtraCiudad('t_ciu','t_ciu_otra')"><option value="">-- Ciudad * --</option></select>
<input id="t_ciu_otra" class="hidden" placeholder="Escribí tu ciudad *">
<label>Oficios *</label>
<div class="checks" id="t_oficios_checks">
<label><input type="checkbox" value="Panadero"> Panadero</label>
<label><input type="checkbox" value="Facturero"> Facturero</label>
<label><input type="checkbox" value="Pastelero"> Pastelero</label>
<label><input type="checkbox" value="Maestro Panadero"> Maestro</label>
<label><input type="checkbox" value="Ayudante"> Ayudante</label>
<label><input type="checkbox" value="Cajero"> Cajero</label>
<label><input type="checkbox" value="Administrativo"> Administrativo</label>
<label><input type="checkbox" value="Otros" onchange="checkOtrosOficio()"> Otros</label>
</div>
<input id="t_oficio_otros" class="hidden" placeholder="¿Qué otro oficio? *">
<label>Experiencia 1 - Obligatoria</label>
<input id="t_exp1_nom" placeholder="Nombre del comercio *">
<input id="t_exp1_dir" placeholder="Dirección del comercio *">
<input id="t_exp1_tel" placeholder="Teléfono de referencia *">
<button class="verde" onclick="guardarT()">✅ GUARDAR</button>
<div id="t_msg"></div>
</div>

<div id="panaderia" class="card hidden">
<h3>Tengo Comercio</h3>
<input id="p_nombre" placeholder="Nombre del Comercio *">
<input id="p_resp" placeholder="Responsable / Dueño *">
<input id="p_dir" placeholder="Dirección *">
<select id="p_prov" onchange="cargarCiudades('p_prov','p_ciu')"><option value="">-- Provincia * --</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<select id="p_ciu" onchange="checkOtraCiudad('p_ciu','p_ciu_otra')"><option value="">-- Ciudad * --</option></select>
<input id="p_ciu_otra" class="hidden" placeholder="Escribí tu ciudad *">
<input id="p_tel" placeholder="WhatsApp del comercio *">
<input id="p_puesto" placeholder="Puesto que buscás *">
<button class="verde" onclick="guardarP()">🔐 Solicitar autorización</button>
<div id="p_msg"></div>
</div>

<div id="bolsa" class="card hidden">
<h3>Ver Bolsa - Solo Autorizados</h3>
<input id="login_wsp" placeholder="Ej: 2974007317">
<button class="verde" style="background:#ff6f00" onclick="loginBolsa()">Ya estoy autorizado, ver bolsa</button>
<div id="login_msg"></div>
<div id="bolsa_panel" class="hidden">
<div id="saludo_comercio" style="background:#DCFCE7;color:#166534;padding:14px;border-radius:10px;font-weight:900;text-align:center;margin:12px 0;font-size:18px"></div>
<select id="f_of" onchange="filtrar()"><option value="">-- Filtrar oficio --</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Maestro Panadero</option><option>Ayudante</option><option>Cajero</option></select>
<select id="f_prov" onchange="filtrar()"><option value="">-- Provincia --</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<select id="f_ciu" onchange="filtrar()"><option value="">-- Ciudad --</option></select>
<button class="verde" onclick="cargarDesdeSheet()">🔄 Cargar</button>
<div id="contador" style="text-align:center;font-weight:800;margin:10px"></div>
<div id="lista"></div>
</div>
</div>

<div id="admin" class="card hidden">
<h3>Admin - Clave: chanchadas</h3>
<input id="a_pass" type="password" placeholder="Ingresar clave">
<button class="verde" onclick="loginAdmin()">ENTRAR</button>
<div id="a_msg"></div>
<div id="a_panel" class="hidden"><div id="stats" style="background:#0A1931;color:#FFC947;padding:12px;border-radius:8px;margin:8px 0"></div><div id="a_lista"></div></div>
</div>

<script>
const URL_SHEET="https://script.google.com/macros/s/AKfycbwcf6ovrDXhAWmUw8uPdMEwTVjnOSvTMKrcmk01B32rfjScyd3-QfTa-Kat54pTpFIM/exec";
const CIUDADES={"Chubut":["Comodoro Rivadavia","Trelew","Puerto Madryn","Rawson","Esquel","Sarmiento","Rada Tilly"],"Santa Cruz":["Rio Gallegos","Caleta Olivia","Pico Truncado"],"Rio Negro":["Bariloche","Cipolletti","General Roca","Viedma"],"Neuquen":["Neuquen Capital","Centenario"],"Tierra del Fuego":["Ushuaia","Rio Grande"]};
const OFICIOS_NO_PANADERIA=["Cajero","Administrativo","Maestranza","Atención al público","Atención"];
let DATA=[]; let MI_WSP="";
function show(id){document.querySelectorAll('#trabajador,#panaderia,#bolsa,#admin').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function cargarCiudades(idProv,idCiu){let prov=document.getElementById(idProv).value;let sel=document.getElementById(idCiu);if(!prov){sel.innerHTML='<option>-- Ciudad --</option>';return;}let lista=CIUDADES[prov]||[];sel.innerHTML='<option value="">-- Ciudad * --</option>'+lista.map(c=>`<option value="${c}">${c}</option>`).join('');}
function checkOtraCiudad(idCiu,idOtra){let val=document.getElementById(idCiu).value;document.getElementById(idOtra).classList.toggle('hidden', val!=='OTRA');}
function checkOtrosOficio(){let chk=document.querySelector('#t_oficios_checks input[value="Otros"]');document.getElementById('t_oficio_otros').classList.toggle('hidden', !chk.checked);}
function checkOtrosPuesto(){let chk=document.querySelector('#p_oficios_checks input[value="Otros"]');if(chk) document.getElementById('p_puesto_otros').classList.toggle('hidden', !chk.checked);}
function getCheckedOficios(idDiv){return Array.from(document.querySelectorAll('#'+idDiv+' input:checked')).map(c=>c.value);}
function validarNombreApellido(n){return n.trim().split(' ').filter(x=>x.length>1).length>=2;}
function validarWSP(w){return w.replace(/\D/g,'').length>=10;}

function loginBolsa(){
 let num=document.getElementById('login_wsp').value.trim();
 if(!validarWSP(num)){document.getElementById('login_msg').innerHTML='<span class=error>❌ 10 dígitos mínimo</span>';return;}
 document.getElementById('login_msg').innerText='Verificando...';
 fetch(URL_SHEET+"?accion=verificar&num="+encodeURIComponent(num)+"&v="+Date.now()).then(r=>r.json()).then(j=>{
  if(j.autorizado){
   MI_WSP=num;
   document.getElementById('saludo_comercio').innerText='👋 Hola '+j.nombre+' '+(j.comercio||'')+' - Bienvenido!';
   document.getElementById('login_msg').innerHTML='<span class=ok>✅ AUTORIZADO: '+j.nombre+'</span>';
   document.getElementById('bolsa_panel').classList.remove('hidden');
   cargarDesdeSheet();
  }else{document.getElementById('login_msg').innerHTML='<span class=error>❌ No autorizado</span>';}
 });
}
function guardarT(){
 let nombre=document.getElementById('t_nombre').value.trim();
 let wsp=document.getElementById('t_wsp').value.trim();
 let prov=document.getElementById('t_prov').value;
 let ciuSel=document.getElementById('t_ciu').value;
 let ciuOtra=document.getElementById('t_ciu_otra').value.trim();
 let ciu= ciuSel=='OTRA'?ciuOtra:ciuSel;
 let oficios=getCheckedOficios('t_oficios_checks');
 let oficioOtros=document.getElementById('t_oficio_otros').value.trim();
 let oficioFinal= oficios.includes('Otros') ? oficios.filter(o=>o!=='Otros').concat(oficioOtros).join(', ') : oficios.join(', ');
 let exp1_nom=document.getElementById('t_exp1_nom').value.trim();
 let exp1_dir=document.getElementById('t_exp1_dir').value.trim();
 let exp1_tel=document.getElementById('t_exp1_tel').value.trim();
 if(!validarNombreApellido(nombre)){document.getElementById('t_msg').innerHTML='<span class=error>❌ Nombre y Apellido completo - 2 palabras mínimo</span>';return;}
 if(!validarWSP(wsp)){document.getElementById('t_msg').innerHTML='<span class=error>❌ WhatsApp mínimo 10 dígitos - poné 2 números no va</span>';return;}
 if(!prov||!ciu){document.getElementById('t_msg').innerHTML='<span class=error>❌ Provincia y Ciudad obligatorias</span>';return;}
 if(oficios.length==0){document.getElementById('t_msg').innerHTML='<span class=error>❌ Elegí al menos un oficio</span>';return;}
 if(oficios.includes('Otros')&&!oficioOtros){document.getElementById('t_msg').innerHTML='<span class=error>❌ Escribí qué otro oficio</span>';return;}
 let necesitaExp=oficios.some(o=>!OFICIOS_NO_PANADERIA.includes(o)&&o!=='Otros');
 if(necesitaExp){
  if(!exp1_nom||!exp1_dir||!exp1_tel){document.getElementById('t_msg').innerHTML='<span class=error>❌ FALTA: Nombre comercio, Dirección y Tel de referencia son OBLIGATORIOS y no te deja guardar si no los ponés</span>';return;}
  if(!validarWSP(exp1_tel)){document.getElementById('t_msg').innerHTML='<span class=error>❌ Tel referencia 10 dígitos mínimo</span>';return;}
 }
 let d={tipo:"trabajador",nombre:nombre,wsp:wsp,provincia:prov,ciudad:ciu,oficio:oficioFinal,panaderia_nomb:exp1_nom,panaderia_direc:exp1_dir,panaderia_cont:exp1_tel};
 document.getElementById('t_msg').innerText='Guardando...';
 fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('t_msg').innerHTML='<span class=ok>✅ Guardado</span>';});
}
function guardarP(){
 let nombreP=document.getElementById('p_nombre').value.trim();
 let resp=document.getElementById('p_resp').value.trim();
 let dir=document.getElementById('p_dir').value.trim();
 let prov=document.getElementById('p_prov').value;
 let ciuSel=document.getElementById('p_ciu').value;
 let ciuOtra=document.getElementById('p_ciu_otra').value.trim();
 let ciu= ciuSel=='OTRA'?ciuOtra:ciuSel;
 let tel=document.getElementById('p_tel').value.trim();
 let puesto=document.getElementById('p_puesto').value.trim();
 if(nombreP.length<3){document.getElementById('p_msg').innerHTML='<span class=error>❌ Nombre comercio obligatorio</span>';return;}
 if(!resp){document.getElementById('p_msg').innerHTML='<span class=error>❌ Responsable obligatorio</span>';return;}
 if(!dir){document.getElementById('p_msg').innerHTML='<span class=error>❌ Dirección obligatoria</span>';return;}
 if(!prov||!ciu){document.getElementById('p_msg').innerHTML='<span class=error>❌ Provincia y Ciudad obligatorias</span>';return;}
 if(!validarWSP(tel)){document.getElementById('p_msg').innerHTML='<span class=error>❌ WhatsApp comercio 10 dígitos - si ponés 2 números no guarda</span>';return;}
 if(!puesto){document.getElementById('p_msg').innerHTML='<span class=error>❌ Puesto que buscás obligatorio</span>';return;}
 let d={tipo:"panaderia",nombreP:nombreP,responsable:resp,direccion:dir,provincia:prov,ciudad:ciu,puesto:puesto,tel:tel};
 document.getElementById('p_msg').innerText='Enviando...';
 fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('p_msg').innerHTML='<span class=ok>✅ Solicitud enviada</span>';});
}
function cargarDesdeSheet(){
 document.getElementById('lista').innerHTML='Cargando...';
 fetch(URL_SHEET+"?accion=listar&v="+Date.now()).then(r=>r.json()).then(j=>{
  DATA=j.trabajadores||[];
  document.getElementById('contador').innerText='Total: '+DATA.length+' trabajadores';
  render(DATA);
 });
}
function render(l){
 if(!l.length){document.getElementById('lista').innerHTML='Sin resultados - revisá que en la hoja Trabajadores haya datos';return;}
 document.getElementById('lista').innerHTML=l.map(t=>`
  <div class=item>
   <b>${t.nombre}</b> <span class=badge>${t.puesto||''}</span><br>
   📍 ${t.ciudad} - ${t.provincia||''}<br>
   📱 ${t.wsp}<br>
   <div class=ultima>
    <b>🏪 Trabajo cargado:</b><br>
    Comercio: <b>${t.panaderia_nomb||'No informó'}</b><br>
    ${t.panaderia_direc?`📍 Dirección: ${t.panaderia_direc}<br>`:''}
    ${t.panaderia_cont?`📞 Tel referencia: ${t.panaderia_cont}`:''}
   </div>
   <button class="wsp" style="margin-top:8px" onclick="window.open('https://wa.me/549${String(t.wsp).replace(/\\D/g,'')}','_blank')">📲 CONTACTAR</button>
  </div>`).join('');
}
function filtrar(){
 let of=(document.getElementById('f_of').value||"").toLowerCase();
 let pr=(document.getElementById('f_prov').value||"").toLowerCase();
 let ci=(document.getElementById('f_ciu').value||"").toLowerCase();
 let base=DATA.filter(t=>{
  let okOf=!of||(t.puesto||"").toLowerCase().includes(of);
  let okPr=!pr||(t.provincia||"").toLowerCase().includes(pr);
  let okCi=!ci||(t.ciudad||"").toLowerCase().includes(ci);
  return okOf&&okPr&&okCi;
 });
 document.getElementById('contador').innerText='Mostrando: '+base.length+' de '+DATA.length;
 render(base);
}
function loginAdmin(){
 if(document.getElementById('a_pass').value!=='chanchadas'){document.getElementById('a_msg').innerHTML='<span class=error>❌ Clave incorrecta - es chanchadas</span>';return;}
 document.getElementById('a_panel').classList.remove('hidden');
 document.getElementById('a_msg').innerHTML='<span class=ok>✅ Admin OK</span>';
 fetch(URL_SHEET+"?accion=listar_admin&v="+Date.now()).then(r=>r.json()).then(j=>{
  document.getElementById('stats').innerText=`TOTAL: ${j.trabajadores.length} postulantes | ${j.panaderias.length} comercios | ${j.autorizados.length} autorizados`;
  document.getElementById('a_lista').innerHTML='<h4>👷 TRABAJADORES</h4>'+j.trabajadores.map(t=>`<div class=item>${t.nombre} | ${t.wsp}</div>`).join('')+'<h4>🏪 COMERCIOS</h4>'+j.panaderias.map(p=>`<div class=item>${p.nombre} | ${p.wsp} | ${p.estado}</div>`).join('')+'<h4>✅ AUTORIZADOS</h4>'+j.autorizados.map(a=>`<div class=item>${a.nombre}</div>`).join('');
 });
}
show('bolsa');
</script>
</body>
</html>
