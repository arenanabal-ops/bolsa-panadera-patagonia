<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLSA PANADERA PATAGONIA - v28</title>
<style>
:root{--azul:#0A1931;--amarillo:#FFC947;--blanco:#fff}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--azul);color:var(--blanco);padding:12px}
header{background:var(--amarillo);color:var(--azul);padding:18px;border-radius:12px;text-align:center;font-weight:900;font-size:22px;margin-bottom:12px}
.card{background:var(--blanco);color:var(--azul);padding:14px;border-radius:12px;margin:10px 0}
button{background:var(--amarillo);color:var(--azul);border:0;padding:12px 16px;border-radius:8px;font-weight:800;width:100%;margin:6px 0;cursor:pointer}
button.rojo{background:#c0392b;color:white}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin:6px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select{flex:1}
.item{border-bottom:1px solid #ddd;padding:8px 0}
.badge{background:var(--azul);color:var(--amarillo);padding:2px 8px;border-radius:12px;font-size:11px}
.hidden{display:none}
</style>
</head>
<body>
<header>🍞 BOLSA PANADERA - v28 OFICIAL</header>
<div id="menu">
<button onclick="show('trabajador')">BUSCO TRABAJO</button>
<button onclick="show('panaderia')">BUSCO EMPLEADO</button>
<button onclick="show('autorizada')">SOY PANADERIA AUTORIZADA</button>
<button onclick="show('admin')">ADMIN chanchadas</button>
</div>
<div id="trabajador" class="card hidden">
<h3>BUSCO TRABAJO</h3>
<input id="t_nombre" placeholder="Tu nombre">
<input id="t_wsp" placeholder="WhatsApp">
<select id="t_provincia"><option value="">Provincia</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<input id="t_ciudad" placeholder="Ciudad">
<select id="t_oficio"><option value="">Oficio</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Maestro Panadero</option><option>Ayudante</option><option>Repartidor</option></select>
<input id="t_otro" placeholder="Otro oficio">
<input id="t_pana1_n" placeholder="Panaderia donde trabajaste 1">
<input id="t_pana1_d" placeholder="Direccion">
<input id="t_pana1_t" placeholder="Telefono">
<button onclick="guardarTrabajador()">GUARDAR EN SHEET</button>
<button onclick="show('menu')">VOLVER</button>
<div id="t_msg"></div>
</div>
<div id="panaderia" class="card hidden">
<h3>BUSCO EMPLEADO</h3>
<input id="p_resp" placeholder="Responsable">
<input id="p_nombre" placeholder="Nombre Panaderia">
<input id="p_dir" placeholder="Direccion">
<input id="p_puesto" placeholder="Puesto">
<input id="p_tel" placeholder="Telefono">
<button onclick="guardarPanaderia()">ENVIAR</button>
<button onclick="show('menu')">VOLVER</button>
<div id="p_msg"></div>
</div>
<div id="autorizada" class="card hidden">
<h3>VER TRABAJADORES - FILTRAR POR OFICIO, PROVINCIA, CIUDAD</h3>
<div class="filters">
<select id="f_oficio" onchange="filtrar()"><option value="">Todos Oficios</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Maestro Panadero</option><option>Ayudante</option></select>
<select id="f_prov" onchange="filtrar()"><option value="">Todas Provincias</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option></select>
<select id="f_ciudad" onchange="filtrar()"><option value="">Todas Ciudades</option></select>
</div>
<button onclick="cargarDesdeSheet()">🔄 ACTUALIZAR DESDE SHEET ORIGINAL</button>
<div id="listaTrabajadores">Cargando...</div>
<button onclick="show('menu')">VOLVER</button>
</div>
<div id="admin" class="card hidden">
<h3>ADMIN</h3>
<input id="admin_pass" placeholder="Clave" type="password">
<button onclick="loginAdmin()">ENTRAR</button>
<div id="adminPanel" class="hidden">
<div id="stats"></div>
<h4>Trabajadores (Sheet Original - Todos los celulares)</h4>
<div id="adminTrab"></div>
<h4>Panaderias (Sheet Original)</h4>
<div id="adminPana"></div>
<button class="rojo" onclick="borrarTodo()">BORRAR TODO ESTE CELULAR</button>
</div>
<button onclick="show('menu')">VOLVER</button>
</div>
<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDV93xIcDOYR-DWnp148hlav0MFkuTlmTpAW_0tisneILlxkQnpKiDcXjk9uMs8U4G/exec";
let DATA_SHEET={trabajadores:[],panaderias:[]};
function show(id){document.querySelectorAll('#trabajador,#panaderia,#autorizada,#admin,#menu').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='autorizada')cargarDesdeSheet();}
function guardarTrabajador(){const d={tipo:"trabajador",nombre:document.getElementById('t_nombre').value,wsp:document.getElementById('t_wsp').value,provincia:document.getElementById('t_provincia').value,ciudad:document.getElementById('t_ciudad').value,oficio:document.getElementById('t_oficio').value,otro_oficio:document.getElementById('t_otro').value,pana1_nombre:document.getElementById('t_pana1_n').value,pana1_dir:document.getElementById('t_pana1_d').value,pana1_tel:document.getElementById('t_pana1_t').value};if(!d.nombre||!d.wsp){alert('Completa');return;}document.getElementById('t_msg').innerText='Enviando...';fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()).then(j=>{document.getElementById('t_msg').innerText='✅ GUARDADO EN SHEET ORIGINAL';let loc=JSON.parse(localStorage.getItem('trabajadores')||'[]');loc.push(d);localStorage.setItem('trabajadores',JSON.stringify(loc));setTimeout(()=>show('menu'),1000);}).catch(e=>{document.getElementById('t_msg').innerText='Error:'+e;});}
function guardarPanaderia(){const d={tipo:"panaderia",resp:document.getElementById('p_resp').value,nombreP:document.getElementById('p_nombre').value,direccion:document.getElementById('p_dir').value,puesto:document.getElementById('p_puesto').value,tel:document.getElementById('p_tel').value};if(!d.nombreP||!d.tel){alert('Completa');return;}document.getElementById('p_msg').innerText='Enviando...';fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:JSON.stringify(d)}).then(r=>r.json()).then(j=>{document.getElementById('p_msg').innerText='✅ ENVIADO';let loc=JSON.parse(localStorage.getItem('panaderias')||'[]');loc.push(d);localStorage.setItem('panaderias',JSON.stringify(loc));setTimeout(()=>show('menu'),1200);}).catch(e=>{document.getElementById('p_msg').innerText='Error:'+e;});}
function cargarDesdeSheet(){document.getElementById('listaTrabajadores').innerHTML='Cargando Sheet...';fetch(GOOGLE_SCRIPT_URL).then(r=>r.json()).then(data=>{DATA_SHEET.trabajadores=data.trabajadores||[];DATA_SHEET.panaderias=data.panaderias||[];renderTrabajadores(DATA_SHEET.trabajadores);actualizarCiudadesFiltro(DATA_SHEET.trabajadores);}).catch(e=>{document.getElementById('listaTrabajadores').innerHTML='Error:'+e;});}
function cargarDesdeSheetAdmin(){fetch(GOOGLE_SCRIPT_URL).then(r=>r.json()).then(data=>{DATA_SHEET.trabajadores=data.trabajadores||[];DATA_SHEET.panaderias=data.panaderias||[];document.getElementById('stats').innerHTML=`<b>Trabajadores: ${DATA_SHEET.trabajadores.length}</b> | <b>Panaderias: ${DATA_SHEET.panaderias.length}</b>`;document.getElementById('adminTrab').innerHTML=DATA_SHEET.trabajadores.map(t=>`<div class=item><b>${t.nombre}</b> ${t.oficio} - ${t.ciudad} ${t.provincia} - ${t.wsp}</div>`).join('');document.getElementById('adminPana').innerHTML=DATA_SHEET.panaderias.map(p=>`<div class=item><b>${p.nombreP}</b> busca ${p.puesto} - ${p.tel}</div>`).join('');});}
function renderTrabajadores(lista){if(!lista.length){document.getElementById('listaTrabajadores').innerHTML='Vacio';return;}document.getElementById('listaTrabajadores').innerHTML=lista.map(t=>`<div class=item><b>${t.nombre}</b> - ${t.oficio} <br>${t.ciudad} ${t.provincia} | ${t.wsp}<br><small>${t.pana1||''}</small></div>`).join('');}
function actualizarCiudadesFiltro(lista){let ciudades=[...new Set(lista.map(t=>t.ciudad).filter(Boolean))];let sel=document.getElementById('f_ciudad');sel.innerHTML='<option value="">Todas Ciudades</option>'+ciudades.map(c=>`<option>${c}</option>`).join('');}
function filtrar(){let of=document.getElementById('f_oficio').value;let pr=document.getElementById('f_prov').value;let ci=document.getElementById('f_ciudad').value;let f=DATA_SHEET.trabajadores.filter(t=>(!of||(t.oficio&&t.oficio.includes(of)))&&(!pr||t.provincia===pr)&&(!ci||t.ciudad===ci));renderTrabajadores(f);}
function loginAdmin(){if(document.getElementById('admin_pass').value==='chanchadas'){document.getElementById('adminPanel').classList.remove('hidden');cargarDesdeSheetAdmin();}else alert('Clave mal');}
function borrarTodo(){if(confirm('Borrar este celu?')){localStorage.clear();location.reload();}}
show('menu');
</script>
</body>
</html>
