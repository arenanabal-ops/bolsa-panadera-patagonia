<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLSA PANADERA DE LA PATAGONIA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#FFF8E7;font-family:system-ui">
<script>
const ADMIN_WA="5492974092277";
const ADMIN_CLAVE="chanchadas";
</script>
<header id="headerAdmin" style="background:#0A1931;color:#FFC947;padding:22px;text-align:center;cursor:pointer">
<h1 style="font-weight:900">BOLSA PANADERA DE LA PATAGONIA</h1>
<p style="color:white;font-size:11px;opacity:.6">GRATIS - SIN INTERMEDIARIOS</p>
</header>
<main style="max-width:600px;margin:18px auto;padding:12px">
<div style="background:white;padding:22px;border-radius:20px;border:1px solid #FFE5A3">
<div id="paso1">
<h2 style="font-weight:900;color:#0A1931">PASO 1/3 - Registro de Panadería</h2>
<form onsubmit="return registrar(event)" style="display:grid;gap:12px;margin-top:18px">
<input id="nombre" required placeholder="Nombre completo *" style="border:2px solid #FFC947;padding:13px;border-radius:12px">
<input id="panaderia" required placeholder="Nombre de la panadería *" style="border:2px solid #FFC947;padding:13px;border-radius:12px">
<input id="direccion" required placeholder="Dirección completa *" style="border:2px solid #FFC947;padding:13px;border-radius:12px">
<input id="telefono" required placeholder="Teléfono / WhatsApp *" style="border:2px solid #FFC947;padding:13px;border-radius:12px">
<button style="background:#FFC947;color:#0A1931;font-weight:900;padding:14px;border-radius:12px;border:none">ENVIAR PARA VALIDACIÓN →</button>
</form>
</div>
<div id="paso2" style="display:none;text-align:center">
<div style="font-size:48px">⏳</div>
<h2 style="font-weight:900;color:#0A1931">PASO 2/3 - En validación</h2>
<div id="resumen" style="background:#FFF8E7;border:2px solid #FFC947;padding:14px;border-radius:14px;margin:14px 0;text-align:left"></div>
<p>Te validamos por WhatsApp al <b>2974092277</b></p>
<a id="btnWA" href="#" target="_blank" style="display:inline-block;background:#25D366;color:white;font-weight:900;padding:14px 24px;border-radius:12px;text-decoration:none;margin-top:14px">📲 ENVIAR WHATSAPP PARA VALIDARME</a>
</div>
<div id="paso3" style="display:none"><div style="background:#d1fae5;padding:16px;border-radius:14px;text-align:center"><p style="font-weight:900;color:#065f46">✅ VALIDADO</p><p id="bienvenida"></p></div></div>
</div>
</main>
<script>
function registrar(e){e.preventDefault();let d={nombre:nombre.value.trim(),panaderia:panaderia.value.trim(),direccion:direccion.value.trim(),telefono:telefono.value.trim(),fecha:new Date().toLocaleString()};localStorage.setItem("empPatagonia",JSON.stringify(d));localStorage.setItem("empEstado","pendiente");mostrarPaso2(d);return false}
function mostrarPaso2(d){paso1.style.display="none";paso2.style.display="block";paso3.style.display="none";resumen.innerHTML="<b>"+d.nombre+"</b><br>"+d.panaderia+"<br>"+d.direccion+"<br>Tel: "+d.telefono;let msg=encodeURIComponent("Hola Admin Bolsa Panadera! Soy "+d.nombre+" de "+d.panaderia+" ("+d.direccion+") Tel:"+d.telefono+" Solicito validación.");btnWA.href="https://wa.me/"+ADMIN_WA+"?text="+msg}
function mostrarPaso3(d){paso1.style.display="none";paso2.style.display="none";paso3.style.display="block";bienvenida.innerText=d.nombre+" - "+d.panaderia}
function adminLogin(){let c=prompt("Clave de administrador:");if(c===ADMIN_CLAVE){localStorage.setItem("empEstado","validado");let d=JSON.parse(localStorage.getItem("empPatagonia"));if(d){mostrarPaso3(d)}}}
(function(){let d=JSON.parse(localStorage.getItem("empPatagonia")||"null");let e=localStorage.getItem("empEstado");if(d&&e==="pendiente")mostrarPaso2(d);if(d&&e==="validado")mostrarPaso3(d)})();
let clicks=0;headerAdmin.addEventListener('click',()=>{clicks++;if(clicks>=5){adminLogin();clicks=0}setTimeout(()=>clicks=0,2500)})
</script>
</body>
</html>
