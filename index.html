<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa Panadera de la Patagonia</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#0A1931;font-family:system-ui">
<div style="max-width:480px;margin:0 auto;padding:16px">
<header style="background:#FFC947;padding:18px;border-radius:18px;text-align:center">
<h1 style="font-weight:900;color:#0A1931">BOLSA PANADERA DE LA PATAGONIA</h1>
</header>

<div id="inicio" style="background:white;padding:20px;border-radius:18px;margin-top:16px;text-align:center">
<button onclick="ver('formEmpleo')" style="background:#0A1931;color:#FFC947;font-weight:900;padding:16px;width:100%;border-radius:14px">🔍 BUSCO TRABAJO</button>
<button onclick="ver('formEmpleado')" style="background:#FFC947;color:#0A1931;font-weight:900;padding:16px;width:100%;margin-top:10px;border-radius:14px;border:2px solid #0A1931">🏪 BUSCO EMPLEADO</button>
<button onclick="location.href='admin.html'" style="background:white;color:#0A1931;font-weight:800;padding:14px;width:100%;margin-top:10px;border-radius:14px;border:2px solid #0A1931">🔐 BOTÓN ADMIN</button>
<button onclick="ver('baja')" style="background:#f5f5f5;padding:14px;width:100%;margin-top:10px;border-radius:14px;border:1px solid #ddd">📩 SOLICITAR BAJA / CONTACTO ADMIN</button>
</div>

<div id="formEmpleo" style="display:none;background:white;padding:20px;border-radius:18px;margin-top:16px">
<button onclick="ver('inicio')">← Volver</button>
<h2 style="font-weight:800;margin-top:8px">Busco Trabajo</h2>
<input id="nombre" placeholder="Nombre completo" style="border:1px solid #ddd;padding:11px;width:100%;margin-top:10px;border-radius:10px">
<input id="tel" placeholder="WhatsApp" style="border:1px solid #ddd;padding:11px;width:100%;margin-top:8px;border-radius:10px">
<button onclick="window.open('https://wa.me/5492974092277?text=BUSCO%20TRABAJO%20'+nombre.value+'%20'+tel.value,'_blank');ver('ok')" style="background:#0A1931;color:#FFC947;padding:12px;width:100%;margin-top:10px;border-radius:10px">ENVIAR</button>
</div>

<div id="formEmpleado" style="display:none;background:white;padding:20px;border-radius:18px;margin-top:16px">
<button onclick="ver('inicio')">← Volver</button>
<h2 style="font-weight:800">Busco Empleado</h2>
<input id="nombreP" placeholder="Panadería" style="border:1px solid #ddd;padding:11px;width:100%;margin-top:10px;border-radius:10px">
<input id="telP" placeholder="WhatsApp" style="border:1px solid #ddd;padding:11px;width:100%;margin-top:8px;border-radius:10px">
<button onclick="window.open('https://wa.me/5492974092277?text=BUSCO%20EMPLEADO%20'+nombreP.value,'_blank');ver('ok')" style="background:#FFC947;padding:12px;width:100%;margin-top:10px;border-radius:10px">PUBLICAR</button>
</div>

<div id="baja" style="display:none;background:white;padding:20px;border-radius:18px;margin-top:16px">
<button onclick="ver('inicio')">← Volver</button>
<h2 style="font-weight:800">Baja / Contacto Admin</h2>
<a href="https://wa.me/5492974092277?text=Darme%20de%20baja" target="_blank" style="display:block;background:#25D366;color:white;text-align:center;padding:12px;border-radius:10px;margin-top:10px;text-decoration:none">WhatsApp Admin - Darme de baja</a>
</div>

<div id="ok" style="display:none;background:white;padding:20px;border-radius:18px;margin-top:16px;text-align:center">
<h2 style="color:green;font-weight:900">✔️ Enviado</h2>
<button onclick="location.reload()" style="background:#0A1931;color:white;padding:10px 16px;border-radius:8px;margin-top:10px">Volver</button>
</div>

</div>
<script>
function ver(id){['inicio','formEmpleo','formEmpleado','baja','ok'].forEach(x=>{let e=document.getElementById(x); if(e) e.style.display='none'}); document.getElementById(id).style.display='block';}
</script>
</body></html>
