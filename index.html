<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa de Trabajo Panaderos Patagonia</title>
<style>
body{font-family:Arial,sans-serif;background:#fff8e1;margin:0;padding:15px}
.card{background:white;max-width:600px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#ff6f00;color:white;border:none;font-weight:bold;cursor:pointer}
.oculto{display:none}
.item{border-bottom:1px solid #eee;padding:10px 0}
.etiqueta{background:#ffe0b2;padding:2px 6px;border-radius:4px;font-size:12px}
.admin{margin-top:20px;background:#fff3e0;padding:15px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h2>🥖 Bolsa de Trabajo - Panaderos Patagonia</h2>

<div id="login">
<p>Si sos panadería autorizada, ingresá tu WhatsApp</p>
<input id="telInput" placeholder="Ej: 2974007317" type="number">
<button onclick="verificar()">Ya estoy autorizado, ver bolsa</button>
<p id="msg"></p>
<p style="font-size:13px">¿No estás autorizado? <a href="https://forms.gle/..." target="_blank">Solicitar autorización</a></p>
</div>

<div id="bolsa" class="oculto">
<h3>✅ Hola <span id="nombreAut"></span></h3>
<button onclick="cargarTrabajadores()">Ver trabajadores disponibles</button>
<button onclick="cargarAutorizados()" style="background:#6d4c41">Ver solo Autorizados (Admin)</button>
<div id="lista"></div>
<button onclick="location.reload()" style="background:#ccc;color:#333;margin-top:20px">Salir</button>
</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGj5IeGWMkOrSoUe-tXdVvcwusHdGGNDVvzzE2lW6EuSy4qJp8ov7Zt1mBXayuzOAk/exec";

function normTel(t){ return String(t||"").replace(/\D/g,"").slice(-10); }

async function verificar(){
  let tel = normTel(document.getElementById("telInput").value);
  if(tel.length < 10){ document.getElementById("msg").innerText="Ingresá un número válido"; return; }
  document.getElementById("msg").innerText="Verificando...";
  try{
    let res = await fetch(`${SCRIPT_URL}?accion=verificar&telefono=${tel}`);
    let texto = await res.text();
    console.log("Respuesta verificar:", texto);
    
    let autorizado = false;
    let nombre = "";
    try{
      let json = JSON.parse(texto);
      if(json === true || json.autorizado === true || json.ok === true) autorizado = true;
      if(json.nombre) nombre = json.nombre;
      if(json.data && json.data.nombre) nombre = json.data.nombre;
    }catch(e){
      if(texto.toLowerCase().includes("true")) autorizado = true;
    }
    
    if(autorizado){
      document.getElementById("login").classList.add("oculto");
      document.getElementById("bolsa").classList.remove("oculto");
      document.getElementById("nombreAut").innerText = nombre || tel;
      document.getElementById("msg").innerText="";
      cargarTrabajadores();
    }else{
      document.getElementById("msg").innerText="❌ No estás autorizado. Tu número no figura en la pestaña Autorizados.";
    }
  }catch(err){
    document.getElementById("msg").innerText="Error de conexión, probá de nuevo";
  }
}

async function cargarTrabajadores(){
  document.getElementById("lista").innerHTML="Cargando trabajadores...";
  try{
    let res = await fetch(`${SCRIPT_URL}?accion=lista_trabajadores`);
    let data = await res.json();
    // data viene como array de arrays desde el Sheet
    let html = "<h3>👷 Trabajadores</h3>";
    // Saltamos encabezado fila 0
    for(let i=1;i<data.length;i++){
      let f = data[i];
      if(!f[0]) continue;
      html += `<div class="item">
        <b>${f[0]||""} ${f[1]||""}</b> <span class="etiqueta">${f[3]||""} ${f[4]||""}</span><br>
        📞 ${f[2]||""} | ${f[5]||""}<br>
        <small>${f[6]||""}</small>
      </div>`;
    }
    document.getElementById("lista").innerHTML=html;
  }catch(e){
    document.getElementById("lista").innerHTML="Error cargando trabajadores";
  }
}

async function cargarAutorizados(){
  document.getElementById("lista").innerHTML="Cargando autorizados...";
  try{
    let res = await fetch(`${SCRIPT_URL}?accion=lista_autorizados`);
    let data = await res.json();
    let html = "<h3>✅ Solo Autorizados</h3>";
    // Tu orden real: A=nombre B=direccion C=comercio D=wsp E=provincia F=ciudad G=puesto H=estado I=fecha
    data.forEach(p=>{
      html += `<div class="item">
        <b>${p.nombre||""}</b> - ${p.comercio||""}<br>
        📱 <b style="color:#ff6f00">${p.wsp||""}</b><br>
        📍 ${p.direccion||""} - ${p.ciudad||""}, ${p.provincia||""}<br>
        <span class="etiqueta">${p.puesto||""}</span> <span class="etiqueta">${p.estado||""}</span><br>
        <small>${p.fecha||""}</small>
      </div>`;
    });
    document.getElementById("lista").innerHTML=html;
  }catch(e){
    document.getElementById("lista").innerHTML="Error cargando autorizados: "+e;
  }
}
</script>
</body>
</html>
