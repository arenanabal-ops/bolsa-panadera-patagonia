<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa Panadera de la Patagonia</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body style="background:#0A1931;font-family:system-ui">
<div style="max-width:500px;margin:0 auto;padding:14px">

<header style="background:#FFC947;padding:16px;border-radius:18px;text-align:center">
<h1 style="font-weight:900;color:#0A1931;font-size:19px;line-height:1.1">BOLSA PANADERA DE LA PATAGONIA</h1>
<p style="font-size:11px;color:#0A1931;margin-top:4px;font-weight:600">Chubut - Santa Cruz - Río Negro - Neuquén - Tierra del Fuego</p>
</header>

<!-- INICIO -->
<div id="inicio" style="background:white;padding:22px;border-radius:18px;margin-top:14px;text-align:center">
<button onclick="ver('formEmpleo')" style="background:#0A1931;color:#FFC947;font-weight:900;padding:18px;width:100%;border-radius:14px;font-size:16px">🔍 BUSCO TRABAJO</button>
<button onclick="ver('formEmpleado')" style="background:#FFC947;color:#0A1931;font-weight:900;padding:18px;width:100%;margin-top:12px;border-radius:14px;border:2px solid #0A1931;font-size:16px">🏪 BUSCO EMPLEADO</button>
<button onclick="ver('baja')" style="background:#f3f4f6;color:#333;font-weight:700;padding:16px;width:100%;margin-top:12px;border-radius:14px;border:1px solid #ddd">📩 SOLICITAR BAJA / CONTACTO ADMIN</button>
<p style="margin-top:18px"><a href="admin.html" style="font-size:10px;color:#bbb;text-decoration:none;letter-spacing:1px">admin •</a></p>
</div>

<!-- BUSCO TRABAJO -->
<div id="formEmpleo" style="display:none;background:white;padding:18px;border-radius:18px;margin-top:14px">
<button onclick="ver('inicio')" style="font-size:12px;font-weight:600">← Volver</button>
<h2 style="font-weight:800;margin-top:8px;font-size:18px">Busco Trabajo</h2>

<input id="nombre" placeholder="Nombre completo" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:12px;border-radius:10px">
<select id="oficio" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:8px;border-radius:10px;background:white">
<option value="">Oficio - Seleccioná</option>
<option>Maestro Panadero</option>
<option>Panadero</option>
<option>Ayudante Panadero</option>
<option>Pastelero</option>
<option>Facturero</option>
<option>Cocinero</option>
<option>Ayudante de Cocina</option>
<option>Mostrador</option>
<option>Cajero</option>
<option>Repartidor</option>
</select>

<div style="border:1.5px solid #e5e7eb;padding:10px;border-radius:12px;margin-top:10px;background:#fafafa">
<input id="pan1" placeholder="Panadería donde trabajaste (1)" style="border:1.5px solid #ddd;padding:12px;width:100%;border-radius:10px">
<input id="telRef1" placeholder="Tel de referencia (1)" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:6px;border-radius:10px">
</div>

<div id="contenedorPanas"></div>
<button id="btnAgregar" onclick="agregarPana()" type="button" style="background:white;border:2px dashed #0A1931;color:#0A1931;padding:11px;width:100%;margin-top:10px;border-radius:10px;font-weight:800;font-size:13px">+ Agregar panadería (hasta 5)</button>

<select id="provincia" onchange="cargarCiudades()" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:10px;border-radius:10px;background:white">
<option value="">Provincia</option><option>Chubut</option><option>Santa Cruz</option><option>Río Negro</option><option>Neuquén</option><option>Tierra del Fuego</option><option>La Pampa</option>
</select>
<select id="ciudad" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:6px;border-radius:10px;background:white"><option value="">Ciudad</option></select>
<input id="ciudadManual" placeholder="Si no está tu ciudad, escribila acá" style="border:1px dashed #aaa;padding:12px;width:100%;margin-top:6px;border-radius:10px">
<input id="tel" placeholder="Tu WhatsApp" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:8px;border-radius:10px">
<button onclick="enviarEmpleo()" style="background:#0A1931;color:#FFC947;font-weight:900;padding:14px;width:100%;margin-top:14px;border-radius:12px">ENVIAR PARA AUTORIZACIÓN</button>
</div>

<!-- BUSCO EMPLEADO CON DESPLEGABLE -->
<div id="formEmpleado" style="display:none;background:white;padding:18px;border-radius:18px;margin-top:14px">
<button onclick="ver('inicio')" style="font-size:12px;font-weight:600">← Volver</button>
<h2 style="font-weight:800;margin-top:8px;font-size:18px">Busco Empleado</h2>

<input id="resp" placeholder="Nombre completo del responsable" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:12px;border-radius:10px">
<input id="nombreP" placeholder="Nombre de la panadería" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:8px;border-radius:10px">

<select id="puesto" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:8px;border-radius:10px;background:white">
<option value="">Puesto buscado - Seleccioná</option>
<option>Maestro Panadero</option>
<option>Panadero</option>
<option>Ayudante Panadero</option>
<option>Pastelero</option>
<option>Facturero</option>
<option>Cocinero</option>
<option>Ayudante de Cocina</option>
<option>Atención al público / Mostrador</option>
<option>Cajero/a</option>
<option>Repartidor</option>
<option>Encargado</option>
<option>Limpieza</option>
</select>

<input id="telP" placeholder="Teléfono panadería" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:8px;border-radius:10px">
<button onclick="enviarEmpleado()" style="background:#FFC947;color:#0A1931;font-weight:900;padding:14px;width:100%;margin-top:14px;border-radius:12px;border:2px solid #0A1931">PUBLICAR</button>
</div>

<!-- AUTORIZACION -->
<div id="autorizar" style="display:none;background:white;padding:22px;border-radius:18px;margin-top:14px;text-align:center">
<h2 style="font-weight:900;color:#2E7D32;font-size:18px">📲 SOLICITUD ENVIADA</h2>
<p id="textoAutorizar" style="font-size:13px;margin-top:10px"></p>
<p style="font-size:11px;color:#666;margin-top:8px">Validación en 24hs - Admin 2974092277</p>
<button onclick="ver('inicio')" style="background:#0A1931;color:#FFC947;font-weight:900;padding:12px;width:100%;margin-top:12px;border-radius:10px">👀 VOLVER AL INICIO</button>
</div>

<div id="baja" style="display:none;background:white;padding:20px;border-radius:18px;margin-top:14px;text-align:center">
<button onclick="ver('inicio')" style="display:block;text-align:left;font-size:12px;font-weight:600">← Volver</button>
<h2 style="font-weight:800;margin-top:8px">Solicitar Baja / Contacto</h2>
<a href="https://wa.me/5492974092277?text=Hola%20Admin%20Bolsa%20Panadera%20quiero%20darme%20de%20baja" target="_blank" style="display:block;background:#25D366;color:white;padding:12px;border-radius:10px;margin-top:12px;text-decoration:none;font-weight:700">WhatsApp Admin - 2974092277</a>
</div>

</div>

<script>
const ciudadesData={Chubut:['Comodoro Rivadavia','Rada Tilly','Sarmiento','Trelew','Rawson','Puerto Madryn','Esquel'], 'Santa Cruz':['Río Gallegos','Caleta Olivia','Pico Truncado'], 'Río Negro':['Viedma','Bariloche','General Roca'], 'Neuquén':['Neuquén','Cutral Co','Zapala'], 'Tierra del Fuego':['Ushuaia','Río Grande'], 'La Pampa':['Santa Rosa','General Pico']}
function cargarCiudades(){let p=provincia.value; let s=ciudad; s.innerHTML='<option value="">Seleccioná ciudad</option>'; (ciudadesData[p]||[]).forEach(c=>{let o=document.createElement('option');o.text=c;o.value=c;s.add(o)});}
function ver(id){['inicio','formEmpleo','formEmpleado','autorizar','baja'].forEach(x=>{let e=document.getElementById(x); if(e) e.style.display='none'}); document.getElementById(id).style.display='block';}
let totalPanas=1;
function agregarPana(){
 if(totalPanas>=5){alert('Máximo 5 panaderías'); return;}
 totalPanas++;
 let div=document.createElement('div'); div.style.cssText='border:1.5px solid #e5e7eb;padding:10px;border-radius:12px;margin-top:8px;background:#fafafa';
 div.innerHTML=`<div style="display:flex;justify-content:space-between"><small style="font-weight:700;font-size:11px">Panadería ${totalPanas}</small><span onclick="this.parentElement.parentElement.remove();totalPanas--;btnAgregar.style.display='block'" style="font-size:11px;color:red;cursor:pointer;font-weight:700">✕ Quitar</span></div>
 <input class="panExtra" placeholder="Panadería donde trabajaste (${totalPanas})" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:6px;border-radius:10px">
 <input class="telExtra" placeholder="Tel de referencia (${totalPanas})" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:6px;border-radius:10px">`;
 contenedorPanas.appendChild(div);
 if(totalPanas>=5) btnAgregar.style.display='none';
}
function enviarEmpleo(){
 if(!nombre.value||!tel.value){alert('Completá nombre y WhatsApp'); return;}
 let extras=''; document.querySelectorAll('.panExtra').forEach((el,i)=>{let t=document.querySelectorAll('.telExtra')[i].value; extras+=`%0APan${i+2}:${el.value} Ref:${t}`});
 let ciudadFinal=ciudadManual.value||ciudad.value;
 let txt=`*BUSCO TRABAJO*%0ANombre:${nombre.value}%0AOficio:${oficio.value}%0APan1:${pan1.value} Ref1:${telRef1.value}${extras}%0AProv:${provincia.value} ${ciudadFinal}%0ATel:${tel.value}`;
 window.open(`https://wa.me/5492974092277?text=${txt}`,'_blank');
 textoAutorizar.innerText=`Gracias ${nombre.value}!`;
 ver('autorizar');
}
function enviarEmpleado(){
 if(!resp.value||!telP.value){alert('Faltan datos'); return;}
 let txt=`*BUSCO EMPLEADO*%0AResp:${resp.value}%0APanaderia:${nombreP.value}%0APuesto:${puesto.value}%0ATel:${telP.value}`;
 window.open(`https://wa.me/5492974092277?text=${txt}`,'_blank');
 textoAutorizar.innerText=`Gracias ${resp.value} - Buscando ${puesto.value}`;
 ver('autorizar');
}
</script>
</body>
</html>
