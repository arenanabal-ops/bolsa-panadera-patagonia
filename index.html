<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BOLSA PANADERA DE LA PATAGONIA</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#fff8e7"><header style="background:#0b2a5b;color:#f5c542;padding:20px;text-align:center"><h1 style="font-weight:900">BOLSA PANADERA DE LA PATAGONIA</h1></header><main style="max-width:600px;margin:auto;padding:15px"><div style="background:white;padding:20px;border-radius:15px"><h2 style="font-weight:bold;color:#0b2a5b">BUSCO EMPLEADO - Registro Obligatorio</h2><p style="font-size:13px">PASO 1: Datos - PASO 2: Validación - PASO 3: Ingreso a CVs</p><form id="f1" onsubmit="return reg(event)" style="display:grid;gap:10px;margin-top:15px"><input id="n" required placeholder="Nombre completo *" style="border:1px solid #ccc;padding:12px;border-radius:8px"><input id="p" required placeholder="Nombre de la panadería *" style="border:1px solid #ccc;padding:12px;border-radius:8px"><input id="d" required placeholder="Dirección completa *" style="border:1px solid #ccc;padding:12px;border-radius:8px"><input id="t" required placeholder="Teléfono / WhatsApp *" style="border:1px solid #ccc;padding:12px;border-radius:8px"><button style="background:#f5c542;color:#0b2a5b;font-weight:900;padding:12px;border-radius:10px">ENVIAR PARA VALIDACIÓN →</button></form><div id="f2" style="display:none;text-align:center"><h2>⏳ En validación</h2><div id="r" style="background:#fff8e7;padding:10px;border-radius:10px;margin:10px 0;text-align:left;font-size:13px"></div><a id="w" href="#" target="_blank" style="display:inline-block;background:#25D366;color:white;padding:12px 20px;border-radius:10px;font-weight:bold;text-decoration:none">📲 ENVIAR WHATSAPP PARA VALIDARME</a><br><br><button onclick="ap()" style="background:#0b2a5b;color:#f5c542;padding:10px 20px;border-radius:10px">✔️ APROBAR (PRUEBA)</button></div><div id="f3" style="display:none"><h3 style="background:#d1fae5;padding:10px;border-radius:10px">✅ VALIDADO - Ya podés ver CVs</h3><p id="b"></p></div></div></main><script>function reg(e){e.preventDefault();let o={n:document.getElementById('n').value,p:document.getElementById('p').value,d:document.getElementById('d').value,t:document.getElementById('t').value};localStorage.setItem('emp',JSON.stringify(o));localStorage.setItem('st','pend');show();return false}function show(){let o=JSON.parse(localStorage.getItem('emp'));document.getElementById('f1').style.display='none';document.getElementById('f2').style.display='block';document.getElementById('r').innerHTML=o.n+'<br>'+o.p+'<br>'+o.d+'<br>Tel:'+o.t;let m=encodeURIComponent('Hola soy '+o.n+' de '+o.p+' '+o.d+' Tel:'+o.t+' solicito validación');document.getElementById('w').href='https://wa.me/542974123456?text='+m}function ap(){localStorage.setItem('st','val');document.getElementById('f2').style.display='none';document.getElementById('f3').style.display='block';let o=JSON.parse(localStorage.getItem('emp'));document.getElementById('b').innerText='Hola '+o.n+' - '+o.p}let s=localStorage.getItem('st');if(s==='pend')show();if(s==='val'){document.getElementById('f1').style.display='none';document.getElementById('f3').style.display='block';}</script></body></html>
