<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Bolsa</title></head>
<body style="background:#0A1931;font-family:system-ui;padding:14px">
<div style="max-width:600px;margin:0 auto">
<div id="login" style="background:white;padding:22px;border-radius:18px;text-align:center;margin-top:60px">
<h2 style="font-weight:900">ADMIN - Bolsa Panadera</h2>
<input id="clave" type="password" placeholder="Clave admin" style="border:1.5px solid #ddd;padding:12px;width:100%;margin-top:12px;border-radius:10px">
<button onclick="entrar()" style="background:#0A1931;color:#FFC947;font-weight:900;padding:12px;width:100%;margin-top:10px;border-radius:10px">ENTRAR</button>
<p style="font-size:10px;color:#999;margin-top:8px">Clave por defecto: panadera2026</p>
</div>

<div id="panel" style="display:none">
<h2 style="color:#FFC947;font-weight:900">PANEL ADMIN</h2>
<button onclick="location.href='index.html'" style="color:white;font-size:12px">← Volver a la bolsa</button>

<div style="background:white;padding:14px;border-radius:14px;margin-top:12px">
<h3 style="font-weight:800">Postulantes - Busco Trabajo (guardados directo)</h3>
<div id="listaTrabajo" style="margin-top:10px"></div>
</div>

<div style="background:white;padding:14px;border-radius:14px;margin-top:12px">
<h3 style="font-weight:800">Empleadores - Pendientes de autorización</h3>
<div id="listaEmpleador" style="margin-top:10px"></div>
</div>
</div>
</div>

<script>
function entrar(){
 if(clave.value==='panadera2026'){
  login.style.display='none'; panel.style.display='block'; cargar();
 } else { alert('Clave incorrecta'); }
}
function cargar(){
 let trabajos=JSON.parse(localStorage.getItem('postulantes')||'[]');
 let html=''; trabajos.forEach((t,i)=>{html+=`<div style="border:1px solid #ddd;padding:8px;border-radius:8px;margin-top:6px;font-size:12px"><b>${t.nombre}</b> - ${t.oficio}<br>${t.pan1} Ref:${t.ref1}<br>${t.prov} ${t.ciudad}<br>Tel:${t.tel}<br><small>${t.fecha}</small> <span onclick="borrarT(${i})" style="color:red;float:right;cursor:pointer">Borrar</span></div>`});
 listaTrabajo.innerHTML=html||'Sin postulantes';

 let emples=JSON.parse(localStorage.getItem('empleadores')||'[]');
 let html2=''; emples.forEach((e,i)=>{html2+=`<div style="border:1px solid #ddd;padding:8px;border-radius:8px;margin-top:6px;font-size:12px;${e.autorizado?'background:#E8F5E9':''}"><b>${e.nombreP}</b> - ${e.puesto}<br>Resp:${e.resp} Tel:${e.tel}<br><small>${e.fecha}</small><br>${e.autorizado?'<b style="color:green">AUTORIZADO</b>':`<button onclick="autorizar(${i})" style="background:green;color:white;padding:4px 8px;border-radius:6px;margin-top:4px">AUTORIZAR</button>`} <span onclick="borrarE(${i})" style="color:red;float:right;cursor:pointer">Borrar</span></div>`});
 listaEmpleador.innerHTML=html2||'Sin solicitudes';
}
function autorizar(i){let l=JSON.parse(localStorage.getItem('empleadores')||'[]'); l[i].autorizado=true; localStorage.setItem('empleadores',JSON.stringify(l)); cargar();}
function borrarT(i){if(confirm('Borrar?')){let l=JSON.parse(localStorage.getItem('postulantes')||'[]'); l.splice(i,1); localStorage.setItem('postulantes',JSON.stringify(l)); cargar();}}
function borrarE(i){if(confirm('Borrar?')){let l=JSON.parse(localStorage.getItem('empleadores')||'[]'); l.splice(i,1); localStorage.setItem('empleadores',JSON.stringify(l)); cargar();}}
</script>
</body>
</html><!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ADMIN</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#EFEBE9"><div style="max-width:600px;margin:0 auto;padding:16px">
<div id="login" style="background:white;padding:22px;border-radius:18px;text-align:center"><input id="clave" type="password" placeholder="Clave" style="border:2px solid #5D4037;padding:11px;border-radius:10px;width:100%"><button onclick="if(clave.value==='chanchadas'){localStorage.setItem('adminOK','si');login.style.display='none';panel.style.display='block';cargar()}" style="background:#5D4037;color:white;padding:12px;width:100%;margin-top:10px;border-radius:10px">ENTRAR</button></div>
<div id="panel" style="display:none;background:white;padding:18px;border-radius:18px"><h2 style="font-weight:900">Panel Admin - Soft Delete</h2><div id="lista"></div></div></div>
<script>
function cargar(){
 let d=JSON.parse(localStorage.getItem('empPatagonia')||'null');
 let c=document.getElementById('lista');
 if(!d){c.innerHTML='Sin datos en este celular. Todo te llega al WhatsApp 2974092277';return}
 c.innerHTML=`<div style="border:1px solid #ddd;padding:12px;border-radius:10px;margin-top:10px"><b>${d.nombre}</b> - ${d.oficio}<br>${d.ciudad}<br><br><button onclick="if(confirm('¿Borrar? Soft delete')&&confirm('Confirmar borrado')){localStorage.removeItem('empPatagonia');cargar()}" style="background:#c62828;color:white;padding:6px 12px;border-radius:8px">X Borrar (soft)</button> <a href="https://wa.me/5492974092277" target="_blank" style="background:#25D366;color:white;padding:6px 12px;border-radius:8px;text-decoration:none">WhatsApp</a></div>`;
}
if(localStorage.getItem('adminOK')==='si'){login.style.display='none';panel.style.display='block';cargar()}
</script></body></html>
