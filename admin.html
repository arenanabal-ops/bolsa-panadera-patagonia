<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ADMIN</title><script src="https://cdn.tailwindcss.com"></script></head>
<body style="background:#0A1931;font-family:system-ui"><div style="max-width:600px;margin:0 auto;padding:16px">
<header style="background:#FFC947;color:#0A1931;padding:16px;border-radius:14px;text-align:center"><h1 style="font-weight:900">🔐 ADMIN</h1><p style="font-size:11px">2974092277</p></header>
<div id="login" style="background:white;margin-top:18px;padding:22px;border-radius:18px;text-align:center"><input id="clave" type="password" placeholder="Clave" style="border:2px solid #0A1931;padding:12px;border-radius:10px;width:100%"><button onclick="if(clave.value==='chanchadas'){localStorage.setItem('adminOK','si');login.style.display='none';panel.style.display='block';cargar()}" style="background:#0A1931;color:#FFC947;font-weight:900;padding:12px;width:100%;margin-top:12px;border-radius:10px">ENTRAR</button></div>
<div id="panel" style="display:none;background:white;margin-top:18px;padding:18px;border-radius:18px"><h2 style="font-weight:900">Solicitudes</h2><div id="lista" style="margin-top:12px"></div><br><a href="index.html">← Volver</a></div></div>
<script>
function cargar(){let d=JSON.parse(localStorage.getItem('empPatagonia')||'null');let c=document.getElementById('lista');if(!d){c.innerHTML='No hay datos en este celular. Revisá tu WhatsApp 2974092277, ahí te llegan todos.';return}c.innerHTML=`<div style="border:2px solid #f59e0b;padding:14px;border-radius:12px"><b>${d.nombre}</b><br>${d.exp||d.puesto}<br>${d.loc}<br>${d.tel}<br><br><a href="https://wa.me/${d.tel.replace(/[^0-9]/g,'')}" target="_blank" style="background:#25D366;color:white;padding:8px 14px;border-radius:8px;text-decoration:none">WhatsApp</a></div>`}
if(localStorage.getItem('adminOK')==='si'){login.style.display='none';panel.style.display='block';cargar()}
</script></body></html>
