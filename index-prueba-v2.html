<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolsa de Trabajo Panaderos - Comodoro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50">
<div class="max-w-5xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-center text-orange-800 my-4">🥖 Bolsa de Panaderos - Patagonia</h1>
  
  <div class="flex justify-center gap-2 mb-6">
    <button onclick="mostrar('trabajador')" class="bg-orange-600 text-white px-4 py-2 rounded">Soy Trabajador</button>
    <button onclick="mostrar('comercio')" class="bg-yellow-600 text-white px-4 py-2 rounded">Soy Panadería</button>
    <button onclick="mostrar('bolsa')" class="bg-green-700 text-white px-4 py-2 rounded">Ver Bolsa (Autorizados)</button>
    <button onclick="mostrar('admin')" class="bg-gray-700 text-white px-2 py-2 rounded text-xs">Admin</button>
  </div>

  <!-- REGISTRO TRABAJADOR -->
  <div id="sec-trabajador" class="bg-white p-6 rounded shadow">
    <h2 class="font-bold text-xl mb-3">Registro Trabajador</h2>
    <input id="t-nombre" placeholder="Nombre y Apellido" class="border p-2 w-full mb-2 rounded">
    <input id="t-wsp" placeholder="WhatsApp ej 2974123456" class="border p-2 w-full mb-2 rounded">
    <input id="t-provincia" value="Chubut" class="border p-2 w-full mb-2 rounded">
    <input id="t-ciudad" value="Comodoro Rivadavia" class="border p-2 w-full mb-2 rounded">
    <select id="t-oficio" class="border p-2 w-full mb-2 rounded">
      <option>Panadero</option><option>Pastelero</option><option>Facturero</option>
      <option>Maestro Panadero</option><option>Ayudante</option><option>Cajera/o</option><option>Repartidor</option>
    </select>
    <div id="exps">
      <h3 class="font-bold mt-4">Experiencia 1</h3>
      <input id="exp1-nombre" placeholder="Nombre panadería" class="border p-2 w-full mb-1 rounded">
      <input id="exp1-dir" placeholder="Dirección" class="border p-2 w-full mb-1 rounded">
      <input id="exp1-tel" placeholder="Tel / WSP referencia" class="border p-2 w-full mb-2 rounded">
    </div>
    <button onclick="registrarTrabajador()" class="bg-orange-600 text-white w-full py-3 rounded font-bold mt-4">REGISTRARME</button>
    <p id="t-msg" class="mt-3 text-center"></p>
  </div>

  <!-- REGISTRO COMERCIO -->
  <div id="sec-comercio" class="bg-white p-6 rounded shadow hidden">
    <h2 class="font-bold text-xl mb-3">Solicitud Panadería / Comercio</h2>
    <input id="c-nombre" placeholder="Tu Nombre" class="border p-2 w-full mb-2 rounded">
    <input id="c-direccion" placeholder="Tu Dirección" class="border p-2 w-full mb-2 rounded">
    <input id="c-comercio" placeholder="Nombre Panadería" class="border p-2 w-full mb-2 rounded">
    <input id="c-wsp" placeholder="WhatsApp Panadería" class="border p-2 w-full mb-2 rounded">
    <input id="c-provincia" value="Chubut" class="border p-2 w-full mb-2 rounded">
    <input id="c-ciudad" value="Comodoro Rivadavia" class="border p-2 w-full mb-2 rounded">
    <input id="c-puesto" placeholder="Puesto que buscas (Panadero)" class="border p-2 w-full mb-2 rounded">
    <button onclick="solicitarComercio()" class="bg-yellow-600 text-white w-full py-3 rounded font-bold mt-4">SOLICITAR ACCESO</button>
    <p id="c-msg" class="mt-3 text-center"></p>
  </div>

  <!-- BOLSA -->
  <div id="sec-bolsa" class="bg-white p-6 rounded shadow hidden">
    <h2 class="font-bold text-xl mb-3">Trabajadores Disponibles</h2>
    <div id="login-comercio" class="mb-4 border p-3 rounded bg-yellow-50">
      <p class="text-sm">Ingresá tu WSP de panadería autorizado para ver y contactar:</p>
      <input id="login-wsp" placeholder="297..." class="border p-2 rounded"><button onclick="loginComercio()" class="bg-green-700 text-white px-3 py-2 rounded ml-2">Entrar</button>
      <p id="login-msg"></p>
    </div>
    <div id="lista-trabajadores" class="grid gap-3"></div>
  </div>

  <!-- ADMIN -->
  <div id="sec-admin" class="bg-white p-6 rounded shadow hidden">
    <h2 class="font-bold">Admin - Autorizar Comercios</h2>
    <input id="admin-wsp" placeholder="WSP a autorizar" class="border p-2 w-full mt-3 rounded">
    <button onclick="autorizar()" class="bg-gray-800 text-white w-full py-2 rounded mt-2">AUTORIZAR</button>
    <p id="admin-msg"></p>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk_Nu95od1nYf85ItKr1SEmsE2DLFN2DfQlT6P1HK0kYl1JL0ulFpMDHs1r_Z8gy5m/exec";
let TODOS_TRABAJADORES = [];
let COMERCIO_LOGUEADO = null;

function mostrar(sec){
  document.getElementById('sec-trabajador').classList.add('hidden');
  document.getElementById('sec-comercio').classList.add('hidden');
  document.getElementById('sec-bolsa').classList.add('hidden');
  document.getElementById('sec-admin').classList.add('hidden');
  document.getElementById('sec-'+sec).classList.remove('hidden');
  if(sec==='bolsa') cargarDatos();
}

async function cargarDatos(){
  const res = await fetch(SCRIPT_URL);
  const data = await res.json();
  TODOS_TRABAJADORES = data.trabajadores.reverse();
  renderTrabajadores();
  localStorage.setItem("cache_comercios", JSON.stringify(data.comercios));
}

function renderTrabajadores(){
  const cont = document.getElementById('lista-trabajadores');
  if(!COMERCIO_LOGUEADO){
    cont.innerHTML = "<p class='text-red-600'>🔒 Logueate arriba para ver los contactos y WSP</p>";
    return;
  }
  cont.innerHTML = TODOS_TRABAJADORES.map(t=>{
    let exps = [];
    try{ exps = JSON.parse(t.experiencias); }catch(e){ exps = [{nombre:t.experiencias}]; }
    let expsHtml = exps.map(e=>`• ${e.nombre} - ${e.dir} - ${e.tel}`).join("<br>");
    return `<div class="border p-4 rounded bg-orange-50">
      <b>${t.nombre}</b> - ${t.oficio} - ${t.ciudad}<br>
      <span class="text-sm text-gray-600">${expsHtml}</span><br>
      <span class="text-sm">WSP: ${t.wsp}</span><br>
      <button onclick='contactarTrabajador(${JSON.stringify(t).replace(/'/g,"&#39;")})' class="bg-green-600 text-white px-4 py-2 rounded mt-2 w-full">📲 CONTACTAR POR WSP</button>
    </div>`;
  }).join("");
}

function loginComercio(){
  let wsp = document.getElementById('login-wsp').value.replace(/\D/g,'');
  let comercios = JSON.parse(localStorage.getItem("cache_comercios")||"[]");
  let encontrado = comercios.find(c => (c.wsp+"").replace(/\D/g,'').includes(wsp) && c.estado==="AUTORIZADO");
  if(encontrado){
    COMERCIO_LOGUEADO = encontrado;
    localStorage.setItem("comercio_autorizado", JSON.stringify(encontrado));
    document.getElementById('login-msg').innerHTML = `<span class="text-green-700 font-bold">✅ Hola ${encontrado.comercio} - Ya podés contactar</span>`;
    renderTrabajadores();
  } else {
    document.getElementById('login-msg').innerHTML = `<span class="text-red-600">❌ Ese WSP no está AUTORIZADO. Andá a tu Excel > comercios > pone AUTORIZADO</span>`;
  }
}

function registrarTrabajador(){
  const data = {
    tipo:"trabajador",
    nombre: document.getElementById('t-nombre').value,
    wsp: document.getElementById('t-wsp').value,
    provincia: document.getElementById('t-provincia').value,
    ciudad: document.getElementById('t-ciudad').value,
    oficio: document.getElementById('t-oficio').value,
    experiencias: JSON.stringify([{nombre:document.getElementById('exp1-nombre').value, dir:document.getElementById('exp1-dir').value, tel:document.getElementById('exp1-tel').value}])
  };
  fetch(SCRIPT_URL,{method:"POST", mode:"no-cors", body:JSON.stringify(data)});
  document.getElementById('t-msg').innerText = "✅ Registrado! Ya estás en la bolsa";
}

function solicitarComercio(){
  const data = {
    tipo:"comercio_solicitud",
    nombre: document.getElementById('c-nombre').value,
    direccion: document.getElementById('c-direccion').value,
    comercio: document.getElementById('c-comercio').value,
    wsp: document.getElementById('c-wsp').value,
    provincia: document.getElementById('c-provincia').value,
    ciudad: document.getElementById('c-ciudad').value,
    puesto: document.getElementById('c-puesto').value
  };
  fetch(SCRIPT_URL,{method:"POST", mode:"no-cors", body:JSON.stringify(data)});
  document.getElementById('c-msg').innerText = "✅ Solicitud enviada. Esperá que te autoricemos (ponemos AUTORIZADO en Excel)";
}

function autorizar(){
  const data = {tipo:"autorizar", wsp: document.getElementById('admin-wsp').value};
  fetch(SCRIPT_URL,{method:"POST", mode:"no-cors", body:JSON.stringify(data)});
  document.getElementById('admin-msg').innerText = "✅ Autorizado";
}

// FUNCIÓN NUEVA AUTOMÁTICA NO INVASIVA
function contactarTrabajador(t){
  const comercio = COMERCIO_LOGUEADO || JSON.parse(localStorage.getItem("comercio_autorizado")||"{}");
  
  // 1. Guarda automático en tu hoja contactos (sin que el comercio llene nada)
  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      tipo: "contacto",
      comercio_wsp: comercio.wsp || "",
      comercio_nombre: comercio.nombre || "",
      comercio_panaderia: comercio.comercio || "",
      trabajador_wsp: t.wsp,
      trabajador_nombre: t.nombre,
      oficio: t.oficio,
      ciudad: t.ciudad
    })
  });

  // 2. Abre WhatsApp directo
  let wspLimpio = (t.wsp+"").replace(/\D/g,'').replace(/^0+/,'');
  if(!wspLimpio.startsWith("54")) wspLimpio = "54"+wspLimpio;
  let mensaje = `Hola ${t.nombre}! Te contacto de ${comercio.comercio || 'una panadería'} de Comodoro. Vi tu perfil de ${t.oficio} en la Bolsa de Panaderos y nos interesa tu perfil. ¿Podemos charlar?`;
  window.open(`https://wa.me/${wspLimpio}?text=${encodeURIComponent(mensaje)}`, "_blank");
}
</script>
</body>
</html>
