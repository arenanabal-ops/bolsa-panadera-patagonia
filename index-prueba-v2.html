<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLSA DE TRABAJO PANADERA DE LA PATAGONIA</title>
<style>
:root{--marron-osc:#3E2723;--marron:#5D4037;--beige:#EFEBE9;--crema:#FFF8F0;--pan:#D7A86E}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui}
body{background:var(--crema);color:var(--marron-osc)}
header{background:var(--marron-osc);color:var(--crema);padding:28px 16px;text-align:center}
header h1{font-size:18px;font-weight:800;text-transform:uppercase}
.wrap{padding:14px;max-width:500px;margin:0 auto}
.card{background:#fff;border:1px solid #D7CCC8;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(62,39,35,0.08)}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;font-weight:800;font-size:15px;margin:8px 0;cursor:pointer;text-align:center}
.btn-pan{background:var(--marron);color:#fff}.btn-beige{background:var(--beige);color:var(--marron-osc);border:1px solid #BCAAA4}
.btn-verde{background:#4CAF50;color:#fff}.btn-wsp{background:#25D366;color:#fff}
.btn-chico{padding:10px;font-size:13px;width:auto;display:inline-block}.btn-rojo{background:#c62828;color:#fff}
input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1.5px solid #BCAAA4;margin:6px 0;font-size:15px;background:#fff;color:#000}
label{font-weight:700;font-size:13px;margin-top:10px;display:block;color:var(--marron)}
.legal-check{background:#FFF8E0;border:1.5px solid var(--pan);padding:12px;border-radius:10px;margin:12px 0;font-size:12px}
.legal-check input{width:auto;display:inline;margin-right:8px}
.legal-footer{font-size:10px;color:#8D6E63;text-align:justify;padding:12px;border-top:1px solid #D7CCC8;margin-top:20px;line-height:1.4}
.exp-box{border:1px dashed #BCAAA4;padding:12px;border-radius:10px;margin:8px 0;background:var(--beige)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>BOLSA DE TRABAJO<br>PANADERA DE LA PATAGONIA</h1></header>
<div class="wrap">
<div id="menu">
<button class="btn btn-pan" onclick="show('trabajador')">🥖 BUSCO TRABAJO</button>
<button class="btn btn-beige" onclick="show('comercio')">🏪 TENGO COMERCIO busco empleado</button>
<button class="btn btn-beige" onclick="show('acceso')">✅ Ya tengo clave de acceso para ver curriculum</button>
<button class="btn btn-beige" onclick="show('contacto')">📩 Darme de baja o contactarme con admin</button>
<div style="margin-top:18px"><button class="btn btn-chico btn-beige" onclick="show('admin')">🔐 Admin</button></div>
<div class="legal-footer"><b>Aviso Legal Ley 25.326:</b> Plataforma intermediaria. No es agencia de empleo.</div>
</div>

<div id="trabajador" class="card hidden"><h3>🥖 Busco trabajo</h3><label>Nombre *</label><input id="t_nombre"><label>WPP *</label><input id="t_wsp"><label>Provincia *</label><select id="t_prov" onchange="cargarCiudades('t_prov','t_ciu','t_ciu_man','t_prov_man')"><option value="">-- Provincia --</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option><option value="OTRA">OTRA</option></select><input id="t_prov_man" class="hidden" placeholder="Escribí provincia"><label>Ciudad *</label><select id="t_ciu"><option>Primero elegí provincia</option></select><input id="t_ciu_man" class="hidden" placeholder="Escribí ciudad"><label>Oficio *</label><select id="t_of" onchange="manejarOficio()"><option value="">-- Oficio --</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Ayudante</option><option>Repartidor</option><option>Cajero</option><option>Reventa</option><option value="OTROS">Otros</option></select><input id="t_of_man" class="hidden" placeholder="Escribí oficio"><div id="exp_section"><h4 id="exp_titulo">Experiencia panadería (máx 5) *</h4><div id="exps"></div><button class="btn btn-beige btn-chico" onclick="addExp()">+ Agregar otra panadería</button></div><div class="legal-check"><input type="checkbox" id="t_legal"><label style="display:inline;font-size:12px">Acepto Ley 25.326 *</label></div><button class="btn btn-verde" onclick="guardarT()">✅ GUARDAR</button><button class="btn btn-beige" onclick="show('menu')">VOLVER</button><div id="t_msg"></div></div>
</div>
</div>

<script>
const URL_SHEET="https://script.google.com/macros/s/AKfycbza4-TFsgE_wqvBDhOnKPMKniC9-UgLFrPPQtw3BHwAx0IYuj19a4EJMQ_u4LJhsAOetg/exec";
const ADMIN_WPP="5492974092277";
const CIUDADES={"Chubut":["Comodoro Rivadavia","Trelew","Puerto Madryn","Rawson","Esquel","Sarmiento","Rada Tilly","Gaiman","Trevelin","Lago Puelo"],"Santa Cruz":["Rio Gallegos","Caleta Olivia","Pico Truncado","Las Heras","Puerto Deseado","El Calafate","Rio Turbio"],"Rio Negro":["Bariloche","Cipolletti","General Roca","Viedma","Allen","El Bolson"],"Neuquen":["Neuquen Capital","Centenario","Cutral Co","Plottier","Zapala","San Martin de los Andes","Villa La Angostura"],"Tierra del Fuego":["Ushuaia","Rio Grande","Tolhuin"]};
const OFICIOS_PANADEROS=["Panadero","Facturero","Pastelero","Ayudante"];let EXP_COUNT=0;
function show(id){document.querySelectorAll('#trabajador,#comercio,#acceso,#contacto,#admin,#menu').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');window.scrollTo(0,0);}
function toggleManual(s,m){let v=document.getElementById(s).value;let el=document.getElementById(m);if(v==='OTROS'||v==='OTRA'){el.classList.remove('hidden');}else{el.classList.add('hidden');el.value='';}}
function manejarOficio(){toggleManual('t_of','t_of_man');let v=document.getElementById('t_of').value;let tit=document.getElementById('exp_titulo');if(["Cajero","Repartidor","Reventa"].includes(v)||v==="OTROS"){tit.innerText="Experiencia panadería (máx 5) opcional";}else{tit.innerText="Experiencia panadería (máx 5) *";}}
function cargarCiudades(idProv,idCiu,idCiuMan,idProvMan){let prov=document.getElementById(idProv).value;let sel=document.getElementById(idCiu);let manC=document.getElementById(idCiuMan);let manP=document.getElementById(idProvMan);if(manP){if(prov==='OTRA'){manP.classList.remove('hidden');}else{manP.classList.add('hidden');manP.value='';}}if(!prov||prov==='OTRA'){sel.innerHTML='<option value="">--</option><option value="OTRA">OTRA</option>';if(manC)manC.classList.remove('hidden');return;}let lista=CIUDADES[prov]||[];sel.innerHTML='<option value="">Seleccionar</option>'+lista.map(c=>`<option>${c}</option>`).join('')+'<option value="OTRA">OTRA</option>';if(manC){sel.onchange=function(){if(this.value==='OTRA'){manC.classList.remove('hidden');}else{manC.classList.add('hidden');manC.value='';}};manC.classList.add('hidden');}}
function addExp(){if(EXP_COUNT>=5){alert('Máx 5');return;}EXP_COUNT++;let div=document.createElement('div');div.className='exp-box';let btn=EXP_COUNT>1?`<button class="btn btn-chico btn-rojo" onclick="this.parentElement.remove();EXP_COUNT--" style="float:right">X</button>`:``;div.innerHTML=`<b>Panadería ${EXP_COUNT}</b> ${btn}<label>Nombre *</label><input id="exp_nom_${EXP_COUNT}"><label>Dirección *</label><input id="exp_dir_${EXP_COUNT}"><label>Tel *</label><input id="exp_tel_${EXP_COUNT}">`;document.getElementById('exps').appendChild(div);}
addExp();
async function guardarT(){if(!document.getElementById('t_legal').checked){alert('Aceptá ley');return;}let provSel=document.getElementById('t_prov').value;let prov=provSel==='OTRA'?document.getElementById('t_prov_man').value.trim():provSel;let ciuSel=document.getElementById('t_ciu').value;let ciu=ciuSel==='OTRA'?document.getElementById('t_ciu_man').value.trim():ciuSel;let ofSel=document.getElementById('t_of').value;let of=ofSel==='OTROS'?document.getElementById('t_of_man').value.trim():ofSel;if(!prov||!ciu||!of){alert('Falta datos');return;}let exps=[];for(let i=1;i<=10;i++){let n=document.getElementById('exp_nom_'+i);if(n&&n.value.trim()){exps.push({nombre:n.value.trim(),dir:document.getElementById('exp_dir_'+i).value.trim(),tel:document.getElementById('exp_tel_'+i).value.trim()});}}if(OFICIOS_PANADEROS.includes(ofSel)&&exps.length===0){alert('Para '+ofSel+' cargá 1 panadería');return;}let wspRaw=document.getElementById('t_wsp').value.trim();let wspNorm=wspRaw.replace(/\D/g,'');if(wspNorm.length<8){alert('WSP inválido');return;}document.getElementById('t_msg').innerText='Verificando...';try{let check=await fetch(URL_SHEET).then(r=>r.json());let existe=check.trabajadores.find(t=>(t.wsp+'').replace(/\D/g,'')===wspNorm);if(existe){document.getElementById('t_msg').innerText='❌ Ya existe';alert('Ya existe');return;}}catch(e){}let d={tipo:"trabajador",nombre:document.getElementById('t_nombre').value.trim(),wsp:wspRaw,provincia:prov,ciudad:ciu,oficio:of,experiencias:JSON.stringify(exps)};document.getElementById('t_msg').innerText='Enviando...';fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('t_msg').innerText='✅ Guardado';setTimeout(()=>show('menu'),1000);});}
</script>
</body>
</html>
