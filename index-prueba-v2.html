<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BOLSA</title>
<style>:root{--m:#3E2723;--c:#FFF8F0}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:var(--c)}header{background:var(--m);color:#fff;padding:20px;text-align:center}.wrap{max-width:500px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;margin:10px 0}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:800;margin:6px 0}.btn-pan{background:#5D4037;color:#fff}.btn-beige{background:#EFEBE9;border:1px solid #BCAAA4}.btn-verde{background:#4CAF50;color:#fff}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #BCAAA4;margin:6px 0}label{font-weight:700;font-size:13px;margin-top:8px;display:block}.exp-box{border:1px dashed #BCAAA4;padding:10px;border-radius:8px;margin:8px 0;background:#EFEBE9}.hidden{display:none}</style>
</head>
<body>
<header>BOLSA PANADERA PATAGONIA - PRUEBA</header>
<div class="wrap">
<div id="menu"><button class="btn btn-pan" onclick="show('trab')">BUSCO TRABAJO</button></div>
<div id="trab" class="card hidden"><h3>BUSCO TRABAJO</h3>
<input id="t_nombre" placeholder="Nombre *"><input id="t_wsp" placeholder="WSP *">
<select id="t_prov" onchange="cargarCiudades()"><option value="">Provincia *</option><option>Chubut</option><option>Santa Cruz</option><option>Rio Negro</option><option>Neuquen</option><option>Tierra del Fuego</option><option value="OTRA">OTRA</option></select><input id="t_prov_man" class="hidden" placeholder="Provincia">
<select id="t_ciu"><option>Ciudad *</option></select><input id="t_ciu_man" class="hidden" placeholder="Ciudad">
<select id="t_of"><option value="">Oficio *</option><option>Panadero</option><option>Facturero</option><option>Pastelero</option><option>Ayudante</option><option>Cajero</option><option>Repartidor</option><option>Reventa</option><option>Otros</option></select>
<div id="exps"></div><button class="btn btn-beige" onclick="addExp()">+ Agregar panaderia</button>
<div><input type="checkbox" id="t_legal"> Acepto Ley 25.326 *</div>
<button class="btn btn-verde" onclick="guardarT()">GUARDAR</button><div id="t_msg"></div><button class="btn btn-beige" onclick="show('menu')">VOLVER</button>
</div></div>
<script>
const URL_SHEET="https://script.google.com/macros/s/AKfycbza4-TFsgE_wqvBDhOnKPMKniC9-UgLFrPPQtw3BHwAx0IYuj19a4EJMQ_u4LJhsAOetg/exec";
const CIUDADES={"Chubut":["Comodoro Rivadavia","Trelew","Puerto Madryn"],"Santa Cruz":["Rio Gallegos","Caleta Olivia"],"Rio Negro":["Bariloche","Roca"],"Neuquen":["Neuquen","Zapala"],"Tierra del Fuego":["Ushuaia","Rio Grande"]};
let EXP_COUNT=0;
function show(id){document.querySelectorAll('.card,#menu').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}
function cargarCiudades(){let prov=document.getElementById('t_prov').value;let sel=document.getElementById('t_ciu');let man=document.getElementById('t_ciu_man');let manP=document.getElementById('t_prov_man');if(prov==='OTRA'){manP.classList.remove('hidden');sel.innerHTML='<option>OTRA</option>';man.classList.remove('hidden');return;}else{manP.classList.add('hidden');}let lista=CIUDADES[prov]||[];sel.innerHTML='<option value="">Seleccionar *</option>'+lista.map(c=>`<option>${c}</option>`).join('')+'<option value="OTRA">OTRA</option>';sel.onchange=function(){if(this.value==='OTRA'){man.classList.remove('hidden');}else{man.classList.add('hidden');}};}
function addExp(){if(EXP_COUNT>=5){alert('Max 5');return;}EXP_COUNT++;let d=document.createElement('div');d.className='exp-box';d.innerHTML=`<b>Panaderia ${EXP_COUNT} * OBLIGATORIO *</b><input id="exp_nom_${EXP_COUNT}" placeholder="Nombre panaderia * OBLIGATORIO - Si no tenes pone NO TENGO"><input id="exp_dir_${EXP_COUNT}" placeholder="Direccion panaderia * OBLIGATORIO - Si no tenes pone NO TENGO"><input id="exp_tel_${EXP_COUNT}" placeholder="Telefono panaderia * OBLIGATORIO - Si no tenes pone NO TENGO">`;document.getElementById('exps').appendChild(d);}
addExp();
async function guardarT(){
if(!document.getElementById('t_legal').checked){alert('Acepta ley');return;}
let prov=document.getElementById('t_prov').value==='OTRA'?document.getElementById('t_prov_man').value:document.getElementById('t_prov').value;
let ciu=document.getElementById('t_ciu').value==='OTRA'?document.getElementById('t_ciu_man').value:document.getElementById('t_ciu').value;
let of=document.getElementById('t_of').value;
if(!prov||!ciu||!of||!document.getElementById('t_nombre').value||!document.getElementById('t_wsp').value){alert('Falta Nombre, WSP, Provincia, Ciudad u Oficio');return;}

// VALIDACION NUEVA OBLIGATORIA NOMBRE+DIR+TEL
let exps=[]; let falta=false;
for(let i=1;i<=EXP_COUNT;i++){
 let n=document.getElementById('exp_nom_'+i);
 if(!n) continue;
 let nom=n.value.trim();
 let dir=document.getElementById('exp_dir_'+i).value.trim();
 let tel=document.getElementById('exp_tel_'+i).value.trim();
 if(!nom || !dir || !tel){ falta=true; }
 else { exps.push({nombre:nom,dir:dir,tel:tel}); }
}
if(falta || exps.length===0){
 alert('⛔ OBLIGATORIO: Tenes que completar Nombre + Direccion + Telefono de la panaderia. Si no tenes experiencia escribi NO TENGO en los 3 campos. Si no, no te deja guardar.');
 return;
}

let wspRaw=document.getElementById('t_wsp').value.trim();
document.getElementById('t_msg').innerText='Enviando a COPIA...';
let d={tipo:"trabajador",nombre:document.getElementById('t_nombre').value.trim(),wsp:wspRaw,provincia:prov,ciudad:ciu,oficio:of,experiencias:JSON.stringify(exps)};
fetch(URL_SHEET,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}).then(()=>{document.getElementById('t_msg').innerText='✅ Guardado en COPIA';setTimeout(()=>show('menu'),1200);});
}
</script>
</body>
</html>
